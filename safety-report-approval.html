<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안전점검보고서 승인/반려 | POMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/admin-topnav.css">
  <link rel="stylesheet" href="css/pagination.css">
  <link rel="stylesheet" href="css/facility-change-request.css">
  <link rel="stylesheet" href="css/type3-port-facility.css">
  <link rel="stylesheet" href="css/facility-change-request-flat.css">
  <link rel="stylesheet" href="css/safety-report-approval.css?v=20260820b">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1240px; }
  </style>
</head>
<body class="app-layout facility-change-request-page type3-port-page fcr-flat-page safety-report-approval-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="type3-page" aria-label="안전점검보고서 승인/반려">
      <div class="type3-section-title">
        <span class="type3-section-title__icon" aria-hidden="true">
          <img src="assets/main/facility-search/icon-condition.svg" alt="" width="24" height="24">
        </span>
        <h1 class="type3-section-title__text">검색조건</h1>
      </div>

      <section class="type3-filter-strip" aria-label="검색조건">
        <form class="type3-filter type3-filter--strip" id="approvalSearchForm" novalidate>
          <div class="type3-filter__fields sra-filter-fields">
            <div class="type3-field type3-field--sm">
              <label for="approvalYear">점검년도</label>
              <select id="approvalYear" name="year">
                <option value="">전체</option>
              </select>
            </div>
            <div class="type3-field">
              <label for="approvalAgency">관리기관</label>
              <select id="approvalAgency" name="agency">
                <option value="">전체</option>
              </select>
            </div>
            <div class="type3-field type3-field--sm">
              <label for="approvalStatus">처리상태</label>
              <select id="approvalStatus" name="status">
                <option value="">전체</option>
                <option value="pending">승인대기</option>
                <option value="approved">승인</option>
                <option value="rejected">반려</option>
                <option value="downloaded">다운로드 완료</option>
              </select>
            </div>
            <div class="type3-field type3-field--grow">
              <label for="approvalName">시설물명</label>
              <input type="text" id="approvalName" name="facilityName" placeholder="시설물명을 입력하세요." autocomplete="off">
            </div>
          </div>
          <div class="type3-filter-actions">
            <button type="submit" class="type3-btn type3-btn--search" id="approvalSearchBtn">
              <img src="assets/main/facility-statistics/icon-search.svg" alt="" width="18" height="18">
              검색하기
            </button>
            <button type="button" class="type3-btn type3-btn--reset" id="approvalResetBtn">
              <img src="assets/main/facility-search/icon-reset.svg" alt="" width="18" height="18">
              초기화
            </button>
          </div>
        </form>
      </section>

      <section class="type3-results-panel" aria-labelledby="approvalResultTitle">
        <div class="type3-results__head">
          <div class="type3-results__count">
            <span class="type3-results__bar-icon" aria-hidden="true">
              <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="8" height="14">
            </span>
            <h2 id="approvalResultTitle" class="type3-results__label">검색결과</h2>
            <p class="type3-results__meta">총 <strong id="approvalResultCount">0</strong>건</p>
          </div>
        </div>

        <div class="type3-table-wrap">
          <table class="type3-table sra-table" aria-label="다운로드 신청 목록">
            <colgroup>
              <col class="col-no">
              <col class="col-year">
              <col class="col-agency">
              <col class="col-name">
              <col class="col-type">
              <col class="col-requester">
              <col class="col-date">
              <col class="col-status">
              <col class="col-report">
              <col class="col-action">
              <col class="col-history">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">번호</th>
                <th scope="col">점검년도</th>
                <th scope="col">관리기관</th>
                <th scope="col">시설명</th>
                <th scope="col">점검구분</th>
                <th scope="col">신청자</th>
                <th scope="col">신청일시</th>
                <th scope="col">처리상태</th>
                  <th scope="col">보고서</th>
                  <th scope="col">승인/반려</th>
                  <th scope="col">결재이력</th>
              </tr>
            </thead>
            <tbody id="approvalTableBody"></tbody>
          </table>
        </div>

        <div class="type3-results-foot">
          <nav class="pagination" id="approvalPagination" aria-label="페이지 이동"></nav>
        </div>
      </section>
    </div>
  </main>

  <!-- 반려 사유 입력 팝업 -->
  <div class="sra-modal" id="sraRejectModal" hidden role="dialog" aria-modal="true" aria-labelledby="sraRejectTitle">
    <div class="sra-modal__backdrop" data-close-reject aria-hidden="true"></div>
    <div class="sra-modal__panel">
      <header class="sra-modal__head">
        <h3 class="sra-modal__title" id="sraRejectTitle">다운로드 신청 반려</h3>
        <button type="button" class="sra-modal__close" data-close-reject aria-label="닫기">&times;</button>
      </header>
      <div class="sra-modal__body">
        <p class="sra-modal__sub" id="sraRejectSub"></p>
        <div class="sra-modal__label">반려 사유<span class="req">*</span></div>
        <textarea class="sra-modal__textarea" id="sraRejectReason" placeholder="반려 사유를 입력하세요.&#10;예) 신청 대상 보고서가 확정 전입니다. 승인 후 재신청 바랍니다."></textarea>
      </div>
      <footer class="sra-modal__foot">
        <button type="button" class="sra-modal__btn sra-modal__btn--cancel" data-close-reject>취소</button>
        <button type="button" class="sra-modal__btn sra-modal__btn--danger" id="sraRejectSubmit">반려 처리</button>
      </footer>
    </div>
  </div>

  <!-- 결재이력 드로어 -->
  <div class="sra-drawer-overlay" id="histDrawerOverlay" data-close-history></div>
  <aside class="sra-drawer" id="histDrawer" aria-labelledby="histDrawerTitle" aria-hidden="true">
    <div class="sra-drawer__top">
      <header class="sra-drawer__head">
        <h2 class="sra-drawer__title" id="histDrawerTitle">결재이력 조회</h2>
        <button type="button" class="sra-drawer__close" data-close-history aria-label="닫기">
          <img src="assets/safety-report-approval/icon-close.svg" alt="" width="16" height="16">
        </button>
      </header>
      <div class="sra-drawer__body" id="histDrawerBody"></div>
    </div>
  </aside>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar-admin.js"></script>
  <script src="js/user-table-utils.js"></script>
  <script src="js/safety-report-approval.js?v=20260728a"></script>
</body>
</html>
