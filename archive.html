<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 | POMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar2.css">
  <link rel="stylesheet" href="css/type3-port-facility.css">
  <link rel="stylesheet" href="css/facility-change-request-flat.css">
  <link rel="stylesheet" href="css/archive-notice.css?v=3">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1280px; }
  </style>
  <link rel="stylesheet" href="css/pagination.css?v=20260812p">
</head>
<body class="app-layout archive-notice-page type3-port-page fcr-flat-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="page-header__nav">
        <a href="archive.html" class="page-header__home" aria-label="자료실 홈">
          <span class="page-header__home-icon" aria-hidden="true">
            <span class="page-header__home-icon-roof"><img src="assets/main/facility-search/detail/figma224/icon-home-roof.svg" alt=""></span>
            <span class="page-header__home-icon-body"><img src="assets/main/facility-search/detail/figma224/icon-home-body.svg" alt=""></span>
            <span class="page-header__home-icon-door"><img src="assets/main/facility-search/detail/figma224/icon-home-door.svg" alt=""></span>
          </span>
        </a>
      </div>
      <nav class="breadcrumb" aria-label="현재 위치">
        <a href="archive.html">자료실</a>
        <span class="breadcrumb__sep" aria-hidden="true">&gt;</span>
        <span class="breadcrumb__current">공지사항</span>
      </nav>
    </header>

    <div class="type3-page" aria-label="공지사항">
      <div class="type3-section-title">
        <span class="type3-section-title__icon" aria-hidden="true">
          <img src="assets/main/facility-statistics/figma188/icon-title-clean.svg" alt="" width="24" height="24">
        </span>
        <h1 class="type3-section-title__text">공지사항</h1>
      </div>

      <section class="type3-filter-strip" aria-label="검색조건">
        <form class="type3-filter type3-filter--strip" id="noticeSearchForm" novalidate onsubmit="return false;">
          <div class="type3-filter__fields">
            <div class="type3-field type3-field--grow">
              <label for="noticeSearch">검색어</label>
              <input type="text" id="noticeSearch" name="keyword" placeholder="제목을 입력하세요." autocomplete="off">
            </div>
          </div>
          <div class="type3-filter-actions">
            <button type="button" class="type3-btn type3-btn--reset" id="noticeResetBtn">
              <img src="assets/main/facility-search/icon-reset.svg" alt="" width="18" height="18">
              초기화
            </button>
            <button type="submit" class="type3-btn type3-btn--search" id="noticeSearchBtn">
              <img src="assets/main/facility-statistics/figma188/icon-search-clean.svg" alt="" width="18" height="18">
              검색하기
            </button>
          </div>
        </form>
      </section>

      <section class="type3-results-panel" aria-labelledby="noticeResultTitle">
        <div class="type3-results__head">
          <div class="type3-results__count">
            <span class="type3-results__bar-icon" aria-hidden="true">
              <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="14" height="14">
            </span>
            <h2 id="noticeResultTitle" class="type3-results__label">검색결과</h2>
            <p class="type3-results__meta">총 <strong id="noticeResultCount">0</strong>건</p>
          </div>
          <div class="type3-results__side">
            <p class="type3-list-guide-note">※ 행을 클릭하면 공지사항 상세로 이동합니다.</p>
            <!-- <button type="button" class="type3-btn type3-btn--create" id="noticeRegisterBtn">
              <img src="assets/main/archive-safety/icon-plus-dark.svg" alt="" width="18" height="18">
              공지등록
            </button> -->
          </div>
        </div>

        <div class="type3-table-wrap">
          <table class="type3-table archive-notice-table" aria-label="공지사항 조회결과">
            <thead>
              <tr>
                <th scope="col" class="col-no">번호</th>
                <th scope="col" class="col-title">제목</th>
                <th scope="col" class="col-author">작성자</th>
                <th scope="col" class="col-date">작성일</th>
                <th scope="col" class="col-views">조회수</th>
              </tr>
            </thead>
            <tbody id="noticeTableBody"></tbody>
          </table>
        </div>
        <div class="type3-results-foot">
          <nav class="pagination" id="noticePagination" aria-label="페이지 이동"></nav>
        </div>
      </section>
    </div>
  </main>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/user-table-utils.js"></script>
  <script src="js/archive.js"></script>
</body>
</html>
