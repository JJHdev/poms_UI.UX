<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시설물 통계 | POMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/sidebar2.css">
  <link rel="stylesheet" href="css/facility-search.css">
  <link rel="stylesheet" href="css/facility-statistics.css?v=20260820b">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; }
  </style>
</head>
<body class="app-layout facility-search-page facility-statistics-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="fs-layout">
      <aside class="fs-lnb" aria-label="시설물 관리 메뉴">
        <div class="fs-lnb__title">
          <span class="fs-lnb__title-text">시설물 관리</span>
        </div>
        <nav class="fs-lnb__nav">
          <a class="fs-lnb__item" href="inspection-status.html">
            <span>점검정보현황</span>
            <img class="fs-lnb__chevron" src="assets/main/facility-search/figma224/icon-lnb-chevron.svg" alt="" width="16" height="16">
          </a>
          <a class="fs-lnb__item" href="safety-grade-status.html">
            <span>안전 등급현황</span>
            <img class="fs-lnb__chevron" src="assets/main/facility-search/figma224/icon-lnb-chevron.svg" alt="" width="16" height="16">
          </a>
          <a class="fs-lnb__item is-active" href="facility-statistics.html" aria-current="page">
            <span>시설물통계</span>
            <img class="fs-lnb__chevron" src="assets/main/facility-search/figma224/icon-lnb-chevron.svg" alt="" width="16" height="16">
          </a>
          <a class="fs-lnb__item" href="special-facility.html">
            <span>특별관리시설</span>
            <img class="fs-lnb__chevron" src="assets/main/facility-search/figma224/icon-lnb-chevron.svg" alt="" width="16" height="16">
          </a>
          <a class="fs-lnb__item" href="type3-port-facility.html" hidden>
            <span>제 3종 항만시설물</span>
            <img class="fs-lnb__chevron" src="assets/main/facility-search/figma224/icon-lnb-chevron.svg" alt="" width="16" height="16">
          </a>
          <a class="fs-lnb__item" href="facility-change-request.html">
            <span>시설물 정보변경 요청</span>
            <img class="fs-lnb__chevron" src="assets/main/facility-search/figma224/icon-lnb-chevron.svg" alt="" width="16" height="16">
          </a>
          <a class="fs-lnb__item" href="data-receive.html">
            <span>자료수신</span>
            <img class="fs-lnb__chevron" src="assets/main/facility-search/figma224/icon-lnb-chevron.svg" alt="" width="16" height="16">
          </a>
          <a class="fs-lnb__item" href="data-process.html">
            <span>자료처리</span>
            <img class="fs-lnb__chevron" src="assets/main/facility-search/figma224/icon-lnb-chevron.svg" alt="" width="16" height="16">
          </a>
          <a class="fs-lnb__item" href="stats-process.html">
            <span>통계처리</span>
            <img class="fs-lnb__chevron" src="assets/main/facility-search/figma224/icon-lnb-chevron.svg" alt="" width="16" height="16">
          </a>
        </nav>
      </aside>

      <div class="fs-manage">
        <header class="page-header">
          <div class="page-header__nav">
            <a href="facility.html" class="page-header__home" aria-label="시설물 관리 홈">
              <span class="page-header__home-icon" aria-hidden="true">
                <span class="page-header__home-icon-roof"><img src="assets/main/facility-search/detail/figma224/icon-home-roof.svg" alt=""></span>
                <span class="page-header__home-icon-body"><img src="assets/main/facility-search/detail/figma224/icon-home-body.svg" alt=""></span>
                <span class="page-header__home-icon-door"><img src="assets/main/facility-search/detail/figma224/icon-home-door.svg" alt=""></span>
              </span>
            </a>
          </div>
          <nav class="breadcrumb" aria-label="현재 위치">
            <a href="inspection-status.html">시설물 관리</a>
            <span class="breadcrumb__sep" aria-hidden="true">&gt;</span>
            <span class="breadcrumb__current">시설물통계</span>
          </nav>
        </header>

        <div class="fac-stats-page">
          <div class="fac-stats-page__title">
            <span class="fac-stats-page__title-icon-wrap" aria-hidden="true">
              <img class="fac-stats-page__title-icon" src="assets/main/facility-statistics/figma188/icon-title-clean.svg" alt="" width="24" height="24">
            </span>
            <h1 class="fac-stats-page__heading">시설물 통계</h1>
          </div>

          <section class="fac-stats-filter-strip" aria-label="시설물 통계 검색조건">
            <div class="fac-stats-filter" aria-label="검색조건">
              <div class="fac-stats-filter__fields">
                <div class="fac-stats-field">
                  <label for="facStatsMajorCategory">대분류</label>
                  <select id="facStatsMajorCategory" name="majorCategory">
                    <option value="facility-status" selected>시설물현황</option>
                    <option value="safety-grade">상태등급</option>
                    <option value="safety-grade-by-kind">상태등급(종별)</option>
                    <option value="service-years">공용년수</option>
                    <option value="seismic-performance">내진성능확보</option>
                  </select>
                </div>
                <div class="fac-stats-field">
                  <label for="facStatsMiddleCategory">중분류</label>
                  <select id="facStatsMiddleCategory" name="middleCategory">
                    <option value="overview" selected>총괄</option>
                    <option value="detail">상세</option>
                  </select>
                </div>
                <div class="fac-stats-field fac-stats-field--minor">
                  <span class="fac-stats-field__label" id="facStatsMinorLabel">소분류</span>
                  <div class="fac-stats-check-box" role="group" aria-labelledby="facStatsMinorLabel">
                    <label class="fac-stats-check" for="facStatsManageNational">
                      <input type="checkbox" id="facStatsManageNational" name="manageCategory" value="national" checked>
                      <span class="fac-stats-check__box" aria-hidden="true"></span>
                      <span class="fac-stats-check__label">국가관리</span>
                    </label>
                    <label class="fac-stats-check" for="facStatsManageLocal">
                      <input type="checkbox" id="facStatsManageLocal" name="manageCategory" value="local" checked>
                      <span class="fac-stats-check__box" aria-hidden="true"></span>
                      <span class="fac-stats-check__label">지자체관리</span>
                    </label>
                    <label class="fac-stats-check" for="facStatsManagePort">
                      <input type="checkbox" id="facStatsManagePort" name="manageCategory" value="port" checked>
                      <span class="fac-stats-check__box" aria-hidden="true"></span>
                      <span class="fac-stats-check__label">항만공사</span>
                    </label>
                    <label class="fac-stats-check" for="facStatsManageOtherDept">
                      <input type="checkbox" id="facStatsManageOtherDept" name="manageCategory" value="otherDept">
                      <span class="fac-stats-check__box" aria-hidden="true"></span>
                      <span class="fac-stats-check__label">타부서</span>
                    </label>
                    <label class="fac-stats-check" for="facStatsManageCivil">
                      <input type="checkbox" id="facStatsManageCivil" name="manageCategory" value="civil">
                      <span class="fac-stats-check__box" aria-hidden="true"></span>
                      <span class="fac-stats-check__label">민유관리</span>
                    </label>
                  </div>
                </div>
              </div>
              <button type="button" class="fac-stats-search-btn" id="facStatsSearchBtn">
                <img src="assets/main/facility-statistics/figma188/icon-search-clean.svg" alt="" width="18" height="18">
                검색하기
              </button>
            </div>
          </section>

          <section class="fac-stats-charts" id="facStatsCharts" aria-label="시설물 통계 차트" hidden>
            <article class="fac-stats-chart-panel fac-stats-chart-panel--bar">
              <div class="fac-stats-chart-panel__head">
                <span class="fac-stats-section-bar" aria-hidden="true">
                  <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="14" height="14">
                </span>
                <h3 class="fac-stats-chart-panel__title" id="facStatsBarTitle">종별통계</h3>
              </div>
              <div id="facStatsBarRows" aria-label="막대 그래프"></div>
            </article>
            <article class="fac-stats-chart-panel fac-stats-chart-panel--donut">
              <div class="fac-stats-chart-panel__head">
                <span class="fac-stats-section-bar" aria-hidden="true">
                  <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="14" height="14">
                </span>
                <h3 class="fac-stats-chart-panel__title" id="facStatsDonutTitle">종별통계</h3>
              </div>
              <div class="fac-stats-donut-wrap">
                <div class="fac-stats-donut-panel">
                  <div class="fac-stats-donut" aria-hidden="true">
                    <div class="fac-stats-donut__ring" id="facStatsDonutRing"></div>
                    <div class="fac-stats-donut__center">
                      <span class="fac-stats-donut__label">총 개소</span>
                      <div class="fac-stats-donut__value-row">
                        <span class="fac-stats-donut__value" id="facStatsDonutTotal">0</span>
                        <span class="fac-stats-donut__unit">개소</span>
                      </div>
                    </div>
                  </div>
                  <ul class="fac-stats-donut-legend" id="facStatsDonutLegend" aria-label="도넛 차트 범례"></ul>
                </div>
              </div>
            </article>
          </section>

          <section class="fac-stats-results" aria-label="시설물 통계 조회결과">
            <div class="fac-stats-results__head">
              <div class="fac-stats-results__head-main">
                <div class="fac-stats-results__title-group">
                  <span class="fac-stats-section-bar" aria-hidden="true">
                    <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="14" height="14">
                  </span>
                  <h2 class="fac-stats-results__title">통계내역</h2>
                  <p class="fac-stats-results__count">
                    총 <strong id="facStatsResultCount">0</strong>건
                  </p>
                </div>
                <div class="fac-stats-view-tabs" role="tablist" aria-label="통계내역 보기">
                  <button type="button" class="fac-stats-view-tab is-active" role="tab" id="facStatsViewFacility" data-view="facility" aria-selected="true">시설물별</button>
                  <button type="button" class="fac-stats-view-tab" role="tab" id="facStatsViewManage" data-view="manage" aria-selected="false">관리주체별</button>
                </div>
              </div>
              <button type="button" class="fac-stats-excel-btn" id="facStatsExcelBtn">
                <img src="assets/main/facility-statistics/figma188/icon-excel-clean.svg" alt="" width="18" height="18">
                엑셀 다운로드
              </button>
            </div>
            <div class="fac-stats-table-wrap" id="facStatsTableWrap">
              <table class="facility-stats-table" id="facStatsTable" aria-label="시설물 통계">
                <colgroup id="facStatsTableColgroup">
                  <col class="facility-stats-table__kind">
                  <col class="facility-stats-table__type">
                  <col class="facility-stats-table__count">
                  <col class="facility-stats-table__manage">
                  <col class="facility-stats-table__manage">
                  <col class="facility-stats-table__manage">
                </colgroup>
                <thead id="facStatsTableHead">
                  <tr>
                    <th colspan="3" scope="colgroup">구분</th>
                    <th rowspan="2" scope="col">국가관리</th>
                    <th rowspan="2" scope="col">지자체 관리</th>
                    <th rowspan="2" scope="col">항만공사</th>
                  </tr>
                  <tr>
                    <th scope="col" class="facility-stats-table__kind-header">종류</th>
                    <th scope="col">시설구분</th>
                    <th scope="col">개소</th>
                  </tr>
                </thead>
                <tbody id="facStatsTableBody"></tbody>
              </table>
            </div>
          </section>
        </div>
      </div>
    </div>
  </main>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/facility-statistics-data.js"></script>
  <script src="js/facility-statistics.js"></script>
</body>
</html>
