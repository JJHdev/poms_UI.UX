<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안전등급현황 상세 | POMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar2.css">
  <link rel="stylesheet" href="css/type3-port-facility.css">
  <link rel="stylesheet" href="css/facility-change-request-flat.css">
  <link rel="stylesheet" href="css/safety-grade-status.css?v=13">
  <link rel="stylesheet" href="css/pagination.css?v=20260812p">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1280px; }
  </style>
</head>
<body class="app-layout safety-grade-detail-page type3-port-page fcr-flat-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="page-header__nav">
        <a href="safety-grade-status.html" class="btn-back" aria-label="이전으로">
          <span class="ico-angle" aria-hidden="true">
            <span class="ico-angle__vec">
              <img src="assets/main/facility-search/detail/figma224/icon-angle-down.svg" alt="">
            </span>
          </span>
        </a>
        <a href="facility.html" class="page-header__home" aria-label="시설물 관리 홈">
          <span class="page-header__home-icon" aria-hidden="true">
            <span class="page-header__home-icon-roof"><img src="assets/main/facility-search/detail/figma224/icon-home-roof.svg" alt=""></span>
            <span class="page-header__home-icon-body"><img src="assets/main/facility-search/detail/figma224/icon-home-body.svg" alt=""></span>
            <span class="page-header__home-icon-door"><img src="assets/main/facility-search/detail/figma224/icon-home-door.svg" alt=""></span>
          </span>
        </a>
      </div>
      <nav class="breadcrumb" aria-label="현재 위치">
        <a href="inspection-status.html">시설물 관리</a>
        <span class="breadcrumb__sep" aria-hidden="true">&gt;</span>
        <a href="safety-grade-status.html">안전 등급현황</a>
        <span class="breadcrumb__sep" aria-hidden="true">&gt;</span>
        <span class="breadcrumb__current" id="gradeDetailCrumb">상세현황</span>
      </nav>
    </header>

    <div class="type3-page grade-detail-page" aria-label="안전등급현황 상세">
      <div class="type3-section-title">
        <span class="type3-section-title__icon" aria-hidden="true">
          <img src="assets/main/facility-statistics/figma188/icon-title-clean.svg" alt="" width="24" height="24">
        </span>
        <h1 class="type3-section-title__text">상세현황 <strong id="detailTitleText"></strong></h1>
      </div>

      <section class="type3-filter-strip" aria-label="상세 목록 검색">
        <form class="type3-filter type3-filter--strip grade-detail-filter" id="gradeDetailSearchForm" novalidate onsubmit="return false;">
          <div class="type3-filter__fields">
            <div class="type3-field type3-field--sm">
              <label for="gradeModalPort">항명</label>
              <select id="gradeModalPort"></select>
            </div>
            <div class="type3-field type3-field--sm">
              <label for="gradeModalSubPort">세부항</label>
              <select id="gradeModalSubPort"></select>
            </div>
            <div class="type3-field">
              <label for="gradeModalCategory">시설물 구분</label>
              <select id="gradeModalCategory"></select>
            </div>
            <div class="type3-field type3-field--grow">
              <label for="gradeModalName">시설물명</label>
              <input type="text" id="gradeModalName" placeholder="시설물명을 입력하세요.">
            </div>
            <div class="type3-field type3-field--sm">
              <label for="gradeModalGrade">상태등급</label>
              <select id="gradeModalGrade"></select>
            </div>
          </div>
          <div class="type3-filter-actions">
            <button type="button" class="type3-btn type3-btn--reset" id="gradeDetailResetBtn">
              <img src="assets/main/facility-search/icon-reset.svg" alt="" width="18" height="18">
              초기화
            </button>
            <button type="submit" class="type3-btn type3-btn--search" id="gradeDetailSearchBtn">
              <img src="assets/main/facility-statistics/figma188/icon-search-clean.svg" alt="" width="18" height="18">
              검색하기
            </button>
          </div>
        </form>
      </section>

      <section class="type3-results-panel grade-results-panel" aria-labelledby="gradeDetailListTitle">
        <div class="type3-results__head">
          <div class="type3-results__count">
            <span class="type3-results__bar-icon" aria-hidden="true">
              <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="14" height="14">
            </span>
            <h2 id="gradeDetailListTitle" class="type3-results__label">검색결과</h2>
            <p class="type3-results__meta">총 <strong id="gradeDetailResultCount">0</strong>건</p>
          </div>
          <div class="type3-results__side">
            <button type="button" class="type3-btn type3-btn--excel" id="gradeDetailExcelBtn">
              <img src="assets/main/facility-statistics/icon-excel.svg" alt="" width="18" height="18">
              엑셀 다운로드
            </button>
          </div>
        </div>
        <div class="type3-table-wrap grade-table-scroll grade-table-scroll--detail">
          <table class="type3-table grade-detail-table" aria-label="안전등급 상세현황">
            <thead>
              <tr>
                <th scope="col" class="col-no">No</th>
                <th scope="col">관리주체</th>
                <th scope="col">항명</th>
                <th scope="col">세부항</th>
                <th scope="col">시설물 구분</th>
                <th scope="col">시설물명</th>
                <th scope="col">상태등급</th>
              </tr>
            </thead>
            <tbody id="detailTableBody"></tbody>
          </table>
        </div>
        <div class="type3-results-foot">
          <nav class="pagination" id="gradeDetailPagination" aria-label="상세현황 페이지"></nav>
        </div>
      </section>
    </div>
  </main>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/safety-grade-status-data.js"></script>
  <script src="js/safety-grade-status-detail.js?v=5"></script>
</body>
</html>
