<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시설물 변경요청 관리 | POMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/admin-topnav.css">
  <link rel="stylesheet" href="css/pagination.css">
  <link rel="stylesheet" href="css/facility-change-request.css">
  <link rel="stylesheet" href="css/type3-port-facility.css">
  <link rel="stylesheet" href="css/facility-change-request-flat.css">
  <link rel="stylesheet" href="css/facility-change-approval.css?v=20260820c">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1240px; }
  </style>
</head>
<body class="app-layout facility-change-request-page type3-port-page fcr-flat-page facility-change-approval-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="type3-page" aria-label="시설물 변경요청 관리">
      <nav class="ua-account-tabs" role="tablist" aria-label="시설물 변경요청 관리 탭">
        <button type="button" class="ua-account-tabs__btn is-active" role="tab" data-fca-tab="approval" aria-selected="true">변경요청 승인/반려</button>
        <button type="button" class="ua-account-tabs__btn" role="tab" data-fca-tab="demolish" aria-selected="false">시설물 철거</button>
      </nav>

      <!-- 변경요청 승인/반려 -->
      <div class="fca-panel is-active" data-fca-panel="approval" role="tabpanel">
        <div class="type3-section-title">
          <span class="type3-section-title__icon" aria-hidden="true">
            <img src="assets/main/facility-search/icon-condition.svg" alt="" width="24" height="24">
          </span>
          <h1 id="fcaSearchTitle" class="type3-section-title__text">검색조건</h1>
        </div>

        <section class="type3-filter-strip" aria-label="검색조건">
          <form class="type3-filter type3-filter--strip fca-filter" id="fcaSearchForm" novalidate>
            <div class="type3-filter__fields fca-filter-fields">
              <div class="type3-filter-row fca-filter-row">
                <div class="type3-field">
                  <label for="fltAgency">관리기관</label>
                  <select id="fltAgency" name="agency">
                    <option value="">전체</option>
                  </select>
                </div>
                <div class="type3-field">
                  <label for="fltPort">항명</label>
                  <select id="fltPort" name="port">
                    <option value="">전체</option>
                  </select>
                </div>
                <div class="type3-field">
                  <label for="fltSubPort">세부항명</label>
                  <select id="fltSubPort" name="subPort">
                    <option value="">전체</option>
                  </select>
                </div>
                <div class="type3-field">
                  <label for="fltType">요청구분</label>
                  <select id="fltType" name="type">
                    <option value="">전체</option>
                    <option value="시설물 일반정보 변경">시설물 일반정보 변경</option>
                    <option value="관리주체변경이관">관리주체변경이관</option>
                    <option value="시설물 삭제">시설물 삭제</option>
                  </select>
                </div>
              </div>
              <div class="type3-filter-row fca-filter-row fca-filter-row--bottom">
                <div class="type3-field type3-field--range">
                  <label>요청일자</label>
                  <div class="fca-date-range">
                    <input type="date" id="fltDateFrom" name="dateFrom" aria-label="요청일자 시작">
                    <em>~</em>
                    <input type="date" id="fltDateTo" name="dateTo" aria-label="요청일자 종료">
                  </div>
                </div>
                <div class="type3-field type3-field--grow">
                  <label for="fltName">시설물명</label>
                  <input type="text" id="fltName" name="facilityName" placeholder="시설물명을 입력하세요." autocomplete="off">
                </div>
                <div class="type3-filter-actions">
                  <button type="submit" class="type3-btn type3-btn--search">
                    <img src="assets/main/facility-statistics/icon-search.svg" alt="" width="18" height="18">
                    검색하기
                  </button>
                  <button type="button" class="type3-btn type3-btn--reset" id="fltResetBtn">
                    <img src="assets/main/facility-search/icon-reset.svg" alt="" width="18" height="18">
                    초기화
                  </button>
                </div>
              </div>
            </div>
          </form>
        </section>

        <section class="type3-results-panel" aria-labelledby="fcaResultsTitle">
          <div class="type3-results__head">
            <div class="type3-results__count">
              <span class="type3-results__bar-icon" aria-hidden="true">
                <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="8" height="14">
              </span>
              <h2 id="fcaResultsTitle" class="type3-results__label">검색결과</h2>
              <p class="type3-results__meta">총 <strong id="fcaResultCount">0</strong>건</p>
            </div>
          </div>

          <div class="type3-table-wrap">
            <table class="type3-table fca-table" aria-label="시설물 변경요청 목록">
              <colgroup>
                <col class="col-no">
                <col class="col-datetime">
                <col class="col-reqtype">
                <col class="col-manage">
                <col class="col-agency">
                <col class="col-port">
                <col class="col-subport">
                <col class="col-ftype">
                <col class="col-fname">
                <col class="col-person">
                <col class="col-reason">
                <col class="col-status">
                <col class="col-history">
              </colgroup>
              <thead>
                <tr>
                  <th scope="col">번호</th>
                  <th scope="col">요청일시</th>
                  <th scope="col">요청구분</th>
                  <th scope="col">관리구분</th>
                  <th scope="col">관리기관</th>
                  <th scope="col">항명</th>
                  <th scope="col">세부항명</th>
                  <th scope="col">시설구분</th>
                  <th scope="col">시설물명</th>
                  <th scope="col">요청자</th>
                  <th scope="col">요청사유</th>
                  <th scope="col">상태</th>
                  <th scope="col">결재이력</th>
                </tr>
              </thead>
              <tbody id="fcaBody"></tbody>
            </table>
          </div>

          <div class="type3-results-foot">
            <nav class="pagination" id="fcaPagination" aria-label="페이지 이동"></nav>
          </div>
        </section>
      </div>

      <!-- 시설물 철거 -->
      <div class="fca-panel" data-fca-panel="demolish" role="tabpanel" hidden>
        <div class="type3-section-title">
          <span class="type3-section-title__icon" aria-hidden="true">
            <img src="assets/main/facility-search/icon-condition.svg" alt="" width="24" height="24">
          </span>
          <h1 id="demSearchTitle" class="type3-section-title__text">검색조건</h1>
        </div>

        <section class="type3-filter-strip" aria-label="검색조건">
          <form class="type3-filter type3-filter--strip fca-filter" id="demSearchForm" novalidate>
            <div class="type3-filter__fields fca-filter-fields">
              <div class="type3-filter-row fca-filter-row">
                <div class="type3-field">
                  <label for="demAgency">관리기관</label>
                  <select id="demAgency" name="agency">
                    <option value="">전체</option>
                  </select>
                </div>
                <div class="type3-field">
                  <label for="demPort">항명</label>
                  <select id="demPort" name="port">
                    <option value="">전체</option>
                  </select>
                </div>
                <div class="type3-field">
                  <label for="demSubPort">세부항명</label>
                  <select id="demSubPort" name="subPort">
                    <option value="">전체</option>
                  </select>
                </div>
                <div class="type3-field">
                  <label for="demType">요청구분</label>
                  <select id="demType" name="type">
                    <option value="">전체</option>
                    <option value="시설물 삭제">시설물 삭제</option>
                  </select>
                </div>
              </div>
              <div class="type3-filter-row fca-filter-row fca-filter-row--bottom">
                <div class="type3-field type3-field--range">
                  <label>요청일자</label>
                  <div class="fca-date-range">
                    <input type="date" id="demDateFrom" name="dateFrom" aria-label="요청일자 시작">
                    <em>~</em>
                    <input type="date" id="demDateTo" name="dateTo" aria-label="요청일자 종료">
                  </div>
                </div>
                <div class="type3-field type3-field--grow">
                  <label for="demName">시설물명</label>
                  <input type="text" id="demName" name="facilityName" placeholder="시설물명을 입력하세요." autocomplete="off">
                </div>
                <div class="type3-filter-actions">
                  <button type="submit" class="type3-btn type3-btn--search">
                    <img src="assets/main/facility-statistics/icon-search.svg" alt="" width="18" height="18">
                    검색하기
                  </button>
                  <button type="button" class="type3-btn type3-btn--reset" id="demResetBtn">
                    <img src="assets/main/facility-search/icon-reset.svg" alt="" width="18" height="18">
                    초기화
                  </button>
                </div>
              </div>
            </div>
          </form>
        </section>

        <section class="type3-results-panel" aria-labelledby="demResultsTitle">
          <div class="type3-results__head">
            <div class="type3-results__count">
              <span class="type3-results__bar-icon" aria-hidden="true">
                <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="8" height="14">
              </span>
              <h2 id="demResultsTitle" class="type3-results__label">검색결과</h2>
              <p class="type3-results__meta">총 <strong id="fcaDemCount">0</strong>건</p>
            </div>
          </div>

          <div class="type3-table-wrap">
            <table class="type3-table fca-table fca-table--demolish" aria-label="시설물 철거 목록">
              <colgroup>
                <col class="col-no">
                <col class="col-datetime">
                <col class="col-agency">
                <col class="col-port">
                <col class="col-subport">
                <col class="col-ftype">
                <col class="col-fname">
                <col class="col-person">
                <col class="col-reason">
              </colgroup>
              <thead>
                <tr>
                  <th scope="col">번호</th>
                  <th scope="col">요청일시</th>
                  <th scope="col">관리기관</th>
                  <th scope="col">항명</th>
                  <th scope="col">세부항명</th>
                  <th scope="col">시설구분</th>
                  <th scope="col">시설물명</th>
                  <th scope="col">요청자</th>
                  <th scope="col">요청사유</th>
                </tr>
              </thead>
              <tbody id="fcaDemBody"></tbody>
            </table>
          </div>
        </section>
      </div>
    </div>
  </main>

  <div class="fca-drawer-overlay" id="histDrawerOverlay" data-close-history></div>
  <aside class="fca-drawer" id="histDrawer" aria-labelledby="histDrawerTitle" aria-hidden="true">
    <div class="fca-drawer__top">
      <header class="fca-drawer__head">
        <h2 class="fca-drawer__title" id="histDrawerTitle">결재이력 조회</h2>
        <button type="button" class="fca-drawer__close" data-close-history aria-label="닫기">
          <img src="assets/facility-change-approval/icon-close.png" alt="" width="16" height="16">
        </button>
      </header>
      <div class="fca-drawer__body" id="histDrawerBody"></div>
    </div>
  </aside>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar-admin.js"></script>
  <script src="js/user-table-utils.js"></script>
  <script src="js/facility-change-approval-data.js"></script>
  <script src="js/facility-change-approval.js?v=20260819f"></script>
</body>
</html>
