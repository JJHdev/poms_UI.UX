<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안전점검 관련자료 | POMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar2.css">
  <link rel="stylesheet" href="css/facility-change-request.css">
  <link rel="stylesheet" href="css/type3-port-facility.css">
  <link rel="stylesheet" href="css/facility-change-request-flat.css">
  <link rel="stylesheet" href="css/archive-board.css?v=3">
  <link rel="stylesheet" href="css/archive-safety-materials.css?v=3">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1280px; }
  </style>
  <link rel="stylesheet" href="css/pagination.css?v=20260812p">
</head>
<body class="app-layout archive-safety-materials-page archive-board-page type3-port-page fcr-flat-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="page-header__nav">
        <a href="archive.html" class="page-header__home" aria-label="자료실 홈">
          <span class="page-header__home-icon" aria-hidden="true">
            <span class="page-header__home-icon-roof"><img src="assets/main/facility-search/detail/figma224/icon-home-roof.svg" alt=""></span>
            <span class="page-header__home-icon-body"><img src="assets/main/facility-search/detail/figma224/icon-home-body.svg" alt=""></span>
            <span class="page-header__home-icon-door"><img src="assets/main/facility-search/detail/figma224/icon-home-door.svg" alt=""></span>
          </span>
        </a>
      </div>
      <nav class="breadcrumb" aria-label="현재 위치">
        <a href="archive.html">자료실</a>
        <span class="breadcrumb__sep" aria-hidden="true">&gt;</span>
        <span class="breadcrumb__current">게시판</span>
      </nav>
    </header>

    <div class="type3-page" aria-label="안전점검 관련자료">
      <div class="type3-section-title">
        <span class="type3-section-title__icon" aria-hidden="true">
          <img src="assets/main/facility-statistics/figma188/icon-title-clean.svg" alt="" width="24" height="24">
        </span>
        <h1 class="type3-section-title__text">안전점검 관련자료</h1>
      </div>

      <div class="archive-board-tabs" role="tablist" aria-label="자료 구분">
        <a href="archive-board.html?tab=law" class="archive-board-tabs__btn" data-board-tab="law" role="tab" aria-selected="false">법/지침/규정</a>
        <a href="archive-board.html?tab=forms" class="archive-board-tabs__btn" data-board-tab="forms" role="tab" aria-selected="false">각종서식</a>
        <a href="archive-board.html?tab=software" class="archive-board-tabs__btn" data-board-tab="software" role="tab" aria-selected="false">매뉴얼 등</a>
        <a href="basic-plan-floor.html" class="archive-board-tabs__btn" data-board-tab="plan" role="tab" aria-selected="false">기본계획평면도</a>
        <a href="archive-safety-materials.html" class="archive-board-tabs__btn is-active" data-board-tab="materials" role="tab" aria-selected="true">안전점검 관련자료</a>
        <a href="archive-board.html?tab=etc" class="archive-board-tabs__btn" data-board-tab="etc" role="tab" aria-selected="false">기타</a>
      </div>

      <section class="type3-filter-strip" aria-label="검색조건">
        <form class="type3-filter type3-filter--strip" id="archiveMaterialsSearchForm" novalidate onsubmit="return false;">
          <div class="type3-filter__fields">
            <div class="type3-field type3-field--grow">
              <label for="archiveMaterialsKeyword">검색어</label>
              <input type="text" id="archiveMaterialsKeyword" name="keyword" placeholder="검색어를 입력해주세요." autocomplete="off">
            </div>
          </div>
          <div class="type3-filter-actions">
            <button type="submit" class="type3-btn type3-btn--search" id="archiveMaterialsSearchBtn">
              <img src="assets/main/facility-statistics/figma188/icon-search-clean.svg" alt="" width="18" height="18">
              검색하기
            </button>
          </div>
        </form>
      </section>

      <section class="type3-results-panel" aria-labelledby="archiveMaterialsResultTitle">
        <div class="type3-results__head">
          <div class="type3-results__count">
            <span class="type3-results__bar-icon" aria-hidden="true">
              <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="14" height="14">
            </span>
            <h2 id="archiveMaterialsResultTitle" class="type3-results__label">조회결과</h2>
            <p class="type3-results__meta">총 <strong id="archiveMaterialsTotal">0</strong>건</p>
          </div>
          <div class="type3-results__side">
            <p class="type3-list-guide-note">※ 행을 클릭하면 자료 상세로 이동합니다.</p>
          </div>
        </div>

        <div class="type3-table-wrap">
          <table class="type3-table archive-materials-table" aria-label="안전점검 관련자료 조회결과">
            <thead>
              <tr>
                <th scope="col" class="col-no">번호</th>
                <th scope="col" class="col-title">제목</th>
                <th scope="col" class="col-desc">내용</th>
                <th scope="col" class="col-file">첨부파일</th>
                <th scope="col" class="col-date">등록일자</th>
              </tr>
            </thead>
            <tbody id="archiveMaterialsTableBody"></tbody>
          </table>
        </div>

        <div class="type3-results-foot">
          <nav class="pagination" id="archiveMaterialsPagination" aria-label="페이지 이동"></nav>
        </div>
      </section>
    </div>

    <!-- 자료 상세/수정/등록 팝업 -->
    <div class="fcr-modal asm-modal" id="archiveModal" hidden role="dialog" aria-modal="true" aria-labelledby="archiveModalTitle">
      <div class="fcr-modal__backdrop" id="archiveModalBackdrop" tabindex="-1" aria-hidden="true"></div>
      <div class="fcr-modal__panel asm-modal__panel" id="archiveModalPanel" data-mode="view" role="document">
        <header class="fcr-modal__head">
          <div class="fcr-modal__head-main">
            <h2 class="fcr-modal__title" id="archiveModalTitle">자료 상세</h2>
            <p class="fcr-modal__sub" id="archiveModalSub"></p>
          </div>
          <button type="button" class="fcr-modal__close" id="archiveModalCloseBtn" aria-label="닫기">
            <img src="assets/main/dashboard/map/Component%201-1.svg" alt="" width="16" height="16">
          </button>
        </header>

        <div class="fcr-modal__stack">
          <div class="fcr-modal__body asm-modal__body">
            <div class="asm-modal__field">
              <label for="modalTitle">제목</label>
              <input type="text" id="modalTitle" placeholder="제목을 입력하세요." autocomplete="off">
              <p class="asm-modal__view-text" id="modalTitleView" hidden></p>
            </div>
            <div class="asm-modal__field">
              <label for="modalDesc">내용</label>
              <textarea id="modalDesc" rows="8" placeholder="내용을 입력하세요."></textarea>
              <p class="asm-modal__view-text asm-modal__view-text--multiline" id="modalDescView" hidden></p>
            </div>
            <div class="asm-modal__field">
              <label>첨부파일</label>
              <div class="asm-modal__file-wrap" id="modalFileEditWrap" hidden>
                <input type="file" id="modalFile" class="asm-modal__file-input" hidden>
                <span class="asm-modal__file-name" id="modalFileNameText">파일을 선택해주세요.</span>
                <button type="button" class="asm-modal__file-btn" id="modalFileBrowseBtn">업로드</button>
              </div>
              <button type="button" class="asm-modal__view-file" id="modalFileView" hidden>
                <img src="assets/main/archive-board/icon-attach.svg" alt="" width="18" height="18">
                <span id="modalFileViewName"></span>
              </button>
            </div>
          </div>

          <footer class="fcr-modal__foot asm-modal__foot">
            <button type="button" class="asm-modal__btn-cancel" id="archiveModalCancelBtn">
              <img src="assets/main/archive-board/icon-cancel.svg" alt="" width="18" height="18">
              취소하기
            </button>
            <button type="button" class="asm-modal__btn-primary" id="archiveModalEditBtn">
              <img src="assets/main/archive-board/icon-edit.svg" alt="" width="18" height="18">
              수정하기
            </button>
            <button type="button" class="asm-modal__btn-primary" id="archiveModalSaveBtn" hidden>
              <img src="assets/main/facility-form/icon-save.svg" alt="" width="18" height="18">
              저장하기
            </button>
          </footer>
        </div>
      </div>
    </div>
  </main>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/user-table-utils.js"></script>
  <script src="js/archive-safety-materials.js"></script>
</body>
</html>
