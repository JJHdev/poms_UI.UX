<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안전등급현황 | POMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar2.css">
  <link rel="stylesheet" href="css/type3-port-facility.css">
  <link rel="stylesheet" href="css/facility-change-request-flat.css">
  <link rel="stylesheet" href="css/safety-grade-status.css?v=14">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1280px; }
  </style>
</head>
<body class="app-layout safety-grade-status-page type3-port-page fcr-flat-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="page-header__nav">
        <a href="facility.html" class="page-header__home" aria-label="시설물 관리 홈">
          <span class="page-header__home-icon" aria-hidden="true">
            <span class="page-header__home-icon-roof"><img src="assets/main/facility-search/detail/figma224/icon-home-roof.svg" alt=""></span>
            <span class="page-header__home-icon-body"><img src="assets/main/facility-search/detail/figma224/icon-home-body.svg" alt=""></span>
            <span class="page-header__home-icon-door"><img src="assets/main/facility-search/detail/figma224/icon-home-door.svg" alt=""></span>
          </span>
        </a>
      </div>
      <nav class="breadcrumb" aria-label="현재 위치">
        <a href="inspection-status.html">시설물 관리</a>
        <span class="breadcrumb__sep" aria-hidden="true">&gt;</span>
        <span class="breadcrumb__current">안전 등급현황</span>
      </nav>
    </header>

    <div class="type3-page grade-status-page" aria-label="안전등급현황">
      <div class="type3-section-title">
        <span class="type3-section-title__icon" aria-hidden="true">
          <img src="assets/main/facility-statistics/figma188/icon-title-clean.svg" alt="" width="24" height="24">
        </span>
        <h1 class="type3-section-title__text">안전등급현황</h1>
      </div>

      <section class="type3-filter-strip" aria-label="검색조건">
        <form class="type3-filter type3-filter--strip grade-filter" novalidate onsubmit="return false;">
          <div class="type3-filter__fields">
            <div class="grade-field grade-field--category">
              <span class="grade-field__label" id="gradeCategoryLegend">시설물 구분</span>
              <div class="grade-category-box" role="group" aria-labelledby="gradeCategoryLegend">
                <label class="grade-check" for="catMooring">
                  <input type="checkbox" id="catMooring" name="category" value="mooring" checked>
                  <span class="grade-check__box" aria-hidden="true"></span>
                  <span class="grade-check__label">계류시설</span>
                </label>
                <label class="grade-check" for="catOuter">
                  <input type="checkbox" id="catOuter" name="category" value="outer" checked>
                  <span class="grade-check__box" aria-hidden="true"></span>
                  <span class="grade-check__label">외곽시설</span>
                </label>
                <label class="grade-check" for="catPier">
                  <input type="checkbox" id="catPier" name="category" value="pier" checked>
                  <span class="grade-check__box" aria-hidden="true"></span>
                  <span class="grade-check__label">부두포장</span>
                </label>
                <label class="grade-check" for="catSafety">
                  <input type="checkbox" id="catSafety" name="category" value="safety">
                  <span class="grade-check__box" aria-hidden="true"></span>
                  <span class="grade-check__label">안전시설</span>
                </label>
              </div>
            </div>
          </div>
          <div class="type3-filter-actions grade-filter-actions">
            <button type="button" class="type3-btn type3-btn--search grade-btn grade-btn--search" id="gradeSearchBtn">
              <img src="assets/main/facility-statistics/figma188/icon-search-clean.svg" alt="" width="18" height="18">
              검색하기
            </button>
          </div>
        </form>
      </section>

      <section class="type3-results-panel grade-results-panel" aria-labelledby="summaryTitle">
        <div class="type3-results__head grade-results__head">
          <div class="type3-results__count grade-results__count">
            <span class="type3-results__bar-icon" aria-hidden="true">
              <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="14" height="14">
            </span>
            <div class="grade-results__left">
              <h2 id="summaryTitle" class="type3-results__label grade-results__label">관리주체별 상태등급 현황 (일반시설)</h2>
              <p class="type3-results__meta grade-results__meta">총 <strong id="gradeResultCount">0</strong>건</p>
              <p class="grade-summary-note" id="safetyGradeNote" hidden>※ 안전시설의 상태등급은 '양호, 보통, 불량'으로 구분됩니다.</p>
            </div>
          </div>
          <div class="type3-results__side">
            <button type="button" class="type3-btn type3-btn--excel grade-btn grade-btn--excel" id="gradeExcelBtn">
              <img src="assets/main/facility-statistics/icon-excel.svg" alt="" width="18" height="18">
              엑셀 다운로드
            </button>
          </div>
        </div>

        <div class="type3-table-wrap grade-table-scroll">
          <table class="type3-table grade-summary-table" aria-label="항별 상태등급 현황">
            <thead id="summaryTableHead">
              <tr>
                <th scope="col" rowspan="2">관리주체</th>
                <th scope="colgroup" colspan="6">상태등급</th>
                <th scope="col" rowspan="2">계</th>
              </tr>
              <tr>
                <th scope="col">A 등급</th>
                <th scope="col">B 등급</th>
                <th scope="col">C 등급</th>
                <th scope="col">D 등급</th>
                <th scope="col">E 등급</th>
                <th scope="col">기타</th>
              </tr>
            </thead>
            <tbody id="summaryTableBody"></tbody>
            <tfoot id="summaryTableFoot"></tfoot>
          </table>
        </div>
        <p class="grade-status-guide-note">※ 관리주체 또는 상태등급을 선택하면 상세현황 페이지로 이동합니다.</p>
      </section>
    </div>
  </main>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/safety-grade-status-data.js"></script>
  <script src="js/safety-grade-status.js"></script>
</body>
</html>
