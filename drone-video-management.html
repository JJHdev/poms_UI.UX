<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>드론 영상관리 | POMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/admin-topnav.css">
  <link rel="stylesheet" href="css/pagination.css">
  <link rel="stylesheet" href="css/facility-change-request.css">
  <link rel="stylesheet" href="css/type3-port-facility.css">
  <link rel="stylesheet" href="css/facility-change-request-flat.css">
  <link rel="stylesheet" href="css/drone-video-management.css?v=20260820a">
  <link rel="stylesheet" href="css/drone-video-player.css">
  <link rel="stylesheet" href="css/system-crud-drawer.css">
  <link rel="stylesheet" href="css/facility-add.css">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1240px; }
  </style>
</head>
<body class="app-layout facility-change-request-page type3-port-page fcr-flat-page drone-video-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="type3-page" aria-label="드론 영상관리">
      <nav class="admin-sub-tabs" aria-label="시스템 관리 하위 메뉴">
        <a href="facility-management.html" class="admin-sub-tabs__btn">시설물 관리</a>
        <a href="maintenance-plan-manage.html" class="admin-sub-tabs__btn">유지관리계획 관리</a>
        <a href="mooring-facility-management.html" class="admin-sub-tabs__btn">계류시설 관리</a>
        <a href="facility-location-status.html" class="admin-sub-tabs__btn">시설물 위치 현황 관리</a>
        <a href="drone-video-management.html" class="admin-sub-tabs__btn is-active" aria-current="page">드론 영상관리</a>
        <a href="responsible-engineer.html" class="admin-sub-tabs__btn">책임기술자 관리</a>
      </nav>

      <div class="type3-section-title">
        <span class="type3-section-title__icon" aria-hidden="true">
          <img src="assets/main/facility-search/icon-condition.svg" alt="" width="24" height="24">
        </span>
        <h1 class="type3-section-title__text" id="droneFilterTitle">검색조건</h1>
      </div>

      <section class="type3-filter-strip" aria-label="검색조건">
        <form class="type3-filter type3-filter--strip" id="droneVideoSearchForm" role="search" novalidate>
          <div class="type3-filter__fields drone-filter-fields">
            <div class="type3-field type3-field--grow">
              <label for="droneSearchTitle">제목</label>
              <input type="text" id="droneSearchTitle" name="title" placeholder="제목을 입력하세요." autocomplete="off">
            </div>
            <div class="type3-field type3-field--grow">
              <label for="droneSearchContent">내용</label>
              <input type="text" id="droneSearchContent" name="content" placeholder="내용을 입력하세요." autocomplete="off">
            </div>
          </div>
          <div class="type3-filter-actions">
            <button type="submit" class="type3-btn type3-btn--search" id="droneVideoSearchBtn">
              <img src="assets/main/facility-statistics/icon-search.svg" alt="" width="18" height="18">
              검색하기
            </button>
            <button type="button" class="type3-btn type3-btn--reset" id="droneVideoResetBtn">
              <img src="assets/main/facility-search/icon-reset.svg" alt="" width="18" height="18">
              초기화
            </button>
          </div>
        </form>
      </section>

      <section class="type3-results-panel" aria-labelledby="droneResultTitle">
        <div class="type3-results__head">
          <div class="type3-results__count">
            <span class="type3-results__bar-icon" aria-hidden="true">
              <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="8" height="14">
            </span>
            <h2 id="droneResultTitle" class="type3-results__label">검색결과</h2>
            <p class="type3-results__meta">총 <strong id="droneVideoResultCount">0</strong>건</p>
          </div>
          <button type="button" class="type3-btn type3-btn--create drone-btn-add" id="droneAddBtn">
            <img src="assets/main/archive-safety/icon-plus-dark.svg" alt="" width="18" height="18">
            추가
          </button>
        </div>

        <div class="type3-table-wrap">
          <table class="type3-table drone-video-table" aria-label="드론 영상 검색결과">
            <colgroup>
              <col class="col-no">
              <col class="col-title">
              <col class="col-attach">
              <col class="col-date">
              <col class="col-play">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">번호</th>
                <th scope="col">제목</th>
                <th scope="col">첨부파일</th>
                <th scope="col">등록일자</th>
                <th scope="col">영상재생</th>
              </tr>
            </thead>
            <tbody id="droneVideoTableBody"></tbody>
          </table>
        </div>

        <div class="type3-results-foot drone-results-foot">
          <nav class="pagination" id="droneVideoPagination" aria-label="페이지 이동"></nav>
          <label class="visually-hidden" for="dronePageSize">페이지당 표시 건수</label>
          <select id="dronePageSize" class="visually-hidden" aria-label="페이지당 표시 건수" tabindex="-1">
            <option value="10" selected>10 / page</option>
            <option value="20">20 / page</option>
            <option value="50">50 / page</option>
          </select>
        </div>
      </section>
    </div>
  </main>

  <div class="crud-drawer" id="droneDrawer" hidden aria-hidden="true">
    <div class="crud-drawer__backdrop" data-drone-drawer-close></div>
    <aside class="crud-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="droneDrawerTitle">
      <header class="crud-drawer__header">
        <div class="crud-drawer__title-wrap">
          <h2 class="crud-drawer__title" id="droneDrawerTitle">드론 영상 등록</h2>
          <p class="crud-drawer__subtitle" id="droneDrawerSubtitle"></p>
        </div>
        <button type="button" class="crud-drawer__close" data-drone-drawer-close aria-label="닫기">&times;</button>
      </header>
      <div class="crud-drawer__body">
        <form id="droneForm" class="crud-form-grid" novalidate>
          <div class="crud-form-row">
            <div class="crud-form-field">
              <label for="droneFormAgency">관리기관 <span class="is-required">*</span></label>
              <select id="droneFormAgency" name="agency" required>
                <option value="">선택</option>
              </select>
            </div>
            <div class="crud-form-field">
              <label for="droneFormPort">항 <span class="is-required">*</span></label>
              <select id="droneFormPort" name="port" required>
                <option value="">선택</option>
              </select>
            </div>
          </div>
          <div class="crud-form-row">
            <div class="crud-form-field">
              <label for="droneFormSubPort">세부항 <span class="is-required">*</span></label>
              <select id="droneFormSubPort" name="subPort" required>
                <option value="">선택</option>
              </select>
            </div>
            <div class="crud-form-field">
              <label for="droneFormFacility">시설물 <span class="is-required">*</span></label>
              <select id="droneFormFacility" name="facilityId" required>
                <option value="">선택</option>
              </select>
            </div>
          </div>
          <div class="crud-form-field">
            <label for="droneFormTitle">제목 <span class="is-required">*</span></label>
            <input type="text" id="droneFormTitle" name="title" required placeholder="제목을 입력하세요.">
          </div>
          <div class="crud-form-field">
            <label for="droneFormContent">내용</label>
            <textarea id="droneFormContent" name="content" placeholder="내용을 입력하세요."></textarea>
          </div>
          <div class="crud-form-field">
            <label for="droneFormYear">촬영년도</label>
            <input type="number" id="droneFormYear" name="filmYear" min="2000" max="2099" placeholder="예: 2024">
          </div>
          <div class="crud-form-field" id="droneFormRegisteredWrap" hidden>
            <label for="droneFormRegistered">등록일자</label>
            <input type="text" id="droneFormRegistered" name="registeredAt" readonly>
          </div>
          <div class="crud-form-field" id="droneFormFileWrap">
            <label>첨부파일</label>
            <div class="crud-file-view" id="droneFormFileView" hidden>
              <span class="crud-attach-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
              </span>
              <span class="crud-file-view__name" id="droneFormFileViewName"></span>
              <span class="crud-file-info__size" id="droneFormFileViewSize"></span>
              <button type="button" class="btn-crud-download" id="droneFormDownloadBtn">다운로드</button>
            </div>
            <div class="fac-add-files" id="droneFormFileUpload">
              <div class="fac-add-file-row">
                <div class="fac-add-file-row__label">첨부파일</div>
                <div class="fac-add-file-row__body">
                  <div class="fac-add-file-picker">
                    <input type="file" id="droneFormFile" name="file" accept="video/*,.mp4,.avi,.mov" hidden>
                    <button type="button" class="fac-add-file-picker__btn" id="droneFormFileBtn">파일 선택</button>
                    <span class="fac-add-file-picker__name" id="droneFormFileName">선택된 파일 없음</span>
                  </div>
                  <div class="fac-add-file-drop">파일을 드래그 해주세요.</div>
                </div>
                <div class="fac-add-file-row__actions">
                  <button type="button" class="btn-fac-file-delete" id="droneFormFileDelete">파일삭제</button>
                  <span class="fac-add-file-row__hint">(용량 : 1GB 미만)</span>
                </div>
              </div>
            </div>
          </div>
        </form>
      </div>
      <footer class="crud-drawer__footer" id="droneDrawerFooter">
        <button type="button" class="btn-crud-save" id="droneSaveBtn">저장</button>
        <button type="button" class="btn-crud-edit" id="droneEditBtn" hidden>수정</button>
        <button type="button" class="btn-crud-delete" id="droneDeleteBtn" hidden>삭제</button>
        <button type="button" class="btn-crud-close" data-drone-drawer-close>닫기</button>
      </footer>
    </aside>
  </div>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar-admin.js"></script>
  <script src="js/drone-video-management-data.js"></script>
  <script src="js/drone-video-player.js"></script>
  <script src="js/drone-video-management.js"></script>
</body>
</html>
