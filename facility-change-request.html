<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시설물 정보변경 요청 | POMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar2.css">
  <link rel="stylesheet" href="css/facility-change-request.css">
  <link rel="stylesheet" href="css/type3-port-facility.css">
  <link rel="stylesheet" href="css/facility-change-request-flat.css">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1280px; }
  </style>
  <link rel="stylesheet" href="css/pagination.css?v=20260812p">
</head>
<body class="app-layout facility-change-request-page type3-port-page fcr-flat-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="page-header__nav">
        <a href="facility.html" class="page-header__home" aria-label="시설물 관리 홈">
          <span class="page-header__home-icon" aria-hidden="true">
            <span class="page-header__home-icon-roof"><img src="assets/main/facility-search/detail/figma224/icon-home-roof.svg" alt=""></span>
            <span class="page-header__home-icon-body"><img src="assets/main/facility-search/detail/figma224/icon-home-body.svg" alt=""></span>
            <span class="page-header__home-icon-door"><img src="assets/main/facility-search/detail/figma224/icon-home-door.svg" alt=""></span>
          </span>
        </a>
      </div>
      <nav class="breadcrumb" aria-label="현재 위치">
        <a href="inspection-status.html">시설물 관리</a>
        <span class="breadcrumb__sep" aria-hidden="true">&gt;</span>
        <span class="breadcrumb__current">시설물 정보변경 요청</span>
      </nav>
    </header>

    <div class="type3-page" aria-label="시설물 정보변경 요청">
      <div class="type3-section-title">
        <span class="type3-section-title__icon" aria-hidden="true">
          <img src="assets/main/facility-statistics/figma188/icon-title-clean.svg" alt="" width="24" height="24">
        </span>
        <h1 class="type3-section-title__text">정보변경 요청</h1>
      </div>

      <section class="type3-filter-strip" aria-label="검색조건">
        <form class="type3-filter type3-filter--strip" id="facilitySearchForm" novalidate onsubmit="return false;">
          <div class="type3-filter__fields">
            <div class="type3-field">
              <label for="filterAgency">관리기관</label>
              <select id="filterAgency" name="agency">
                <option value="">전체</option>
              </select>
            </div>
            <div class="type3-field type3-field--sm">
              <label for="filterPort">항</label>
              <select id="filterPort" name="port">
                <option value="">전체</option>
              </select>
            </div>
            <div class="type3-field type3-field--sm">
              <label for="filterSubPort">세부항</label>
              <select id="filterSubPort" name="subPort">
                <option value="">전체</option>
              </select>
            </div>
            <div class="type3-field type3-field--grow">
              <label for="filterFacilityName">시설물명</label>
              <input type="text" id="filterFacilityName" name="facilityName" placeholder="시설물명을 입력하세요.">
            </div>
          </div>
          <div class="type3-filter-actions">
            <button type="button" class="type3-btn type3-btn--reset" id="facilityResetBtn">
              <img src="assets/main/facility-search/icon-reset.svg" alt="" width="18" height="18">
              초기화
            </button>
            <button type="submit" class="type3-btn type3-btn--search" id="facilitySearchBtn">
              <img src="assets/main/facility-statistics/figma188/icon-search-clean.svg" alt="" width="18" height="18">
              검색하기
            </button>
          </div>
        </form>
      </section>

      <section class="type3-results-panel" aria-labelledby="facilityResultsTitle">
        <div class="type3-results__head">
          <div class="type3-results__count">
            <span class="type3-results__bar-icon" aria-hidden="true">
              <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="14" height="14">
            </span>
            <h2 id="facilityResultsTitle" class="type3-results__label">검색결과</h2>
            <p class="type3-results__meta">총 <strong id="facilityResultCount">0</strong>건</p>
          </div>
          <div class="type3-results__side">
            <p class="type3-list-guide-note">※ 행을 클릭하면 시설물 정보변경 요청 상세로 이동합니다.</p>
          </div>
        </div>
        <div class="type3-table-wrap">
          <table class="type3-table fcr-table" aria-label="기타시설물 목록">
            <thead>
              <tr>
                <th scope="col" class="col-no">번호</th>
                <th scope="col" class="col-port-cat">항만구분</th>
                <th scope="col" class="col-manage" hidden>관리구분</th>
                <th scope="col" class="col-agency">관리기관</th>
                <th scope="col" class="col-sea" hidden>해역</th>
                <th scope="col" class="col-port">항명</th>
                <th scope="col" class="col-subport">세부항명</th>
                <th scope="col" class="col-type">시설구분</th>
                <th scope="col" class="col-name">시설물명</th>
                <th scope="col" class="col-history">결재이력</th>
              </tr>
            </thead>
            <tbody id="facilityTableBody"></tbody>
          </table>
        </div>
        <div class="type3-results-foot">
          <nav class="pagination" id="facilityPagination" aria-label="페이지 이동"></nav>
        </div>
      </section>
    </div>
  </main>

  <!-- 결재이력 팝업 -->
  <div class="fcr-modal" id="fcrHistoryModal" hidden role="dialog" aria-modal="true" aria-labelledby="fcrHistoryTitle">
    <div class="fcr-modal__backdrop" data-close-fcr-history tabindex="-1" aria-hidden="true"></div>
    <div class="fcr-modal__panel" role="document">
      <header class="fcr-modal__head">
        <div class="fcr-modal__head-main">
          <h2 class="fcr-modal__title" id="fcrHistoryTitle">결재이력</h2>
          <p class="fcr-modal__sub" id="fcrHistorySub"></p>
        </div>
        <button type="button" class="fcr-modal__close" data-close-fcr-history aria-label="결재이력 닫기">
          <img src="assets/main/dashboard/map/Component%201-1.svg" alt="" width="16" height="16">
        </button>
      </header>

      <div class="fcr-modal__stack">
        <div class="fcr-modal__body">
          <div class="fcr-modal__board">
            <div class="fcr-modal__table-wrap">
              <table class="fcr-history-table" aria-label="결재이력">
                <thead>
                  <tr>
                    <th scope="col" style="width:70px">구분</th>
                    <th scope="col">요청자</th>
                    <th scope="col">소속</th>
                    <th scope="col" style="width:130px">일자</th>
                    <th scope="col">검토자</th>
                    <th scope="col">의견</th>
                    <th scope="col" style="width:70px">상태</th>
                  </tr>
                </thead>
                <tbody id="fcrHistoryBody"></tbody>
              </table>
            </div>
            <nav class="pagination fcr-paging" id="fcrHistoryPaging" aria-label="결재이력 페이지"></nav>
          </div>
        </div>

        <footer class="fcr-modal__foot">
          <button type="button" class="fcr-modal__btn-close" data-close-fcr-history">닫기</button>
        </footer>
      </div>
    </div>
  </div>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/facility-management-data.js"></script>
  <script src="js/facility-change-approval-data.js"></script>
  <script src="js/facility-change-request.js"></script>
</body>
</html>
