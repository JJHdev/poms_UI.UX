<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a2d5c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>정기안전점검 | POMS 모바일</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/mobile-common.css">
  <link rel="stylesheet" href="../css/mobile-inspection.css">
</head>
<body class="mobile-app-page">
  <div class="mobile-app">
    <header class="mobile-header">
      <a href="home.html" class="mobile-header__brand" aria-label="홈으로 이동">
        <span class="mobile-header__icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="5" r="3"/>
            <line x1="12" y1="8" x2="12" y2="21"/>
            <path d="M5 12H2a10 10 0 0 0 20 0h-3"/>
          </svg>
        </span>
        <div class="mobile-header__text">
          <p class="mobile-header__eyebrow">항만 시설 지킴이</p>
          <h1 class="mobile-header__title">해양수산부 POMS</h1>
        </div>
      </a>
      <button type="button" class="mobile-header__menu" id="mobileMenuBtn" aria-label="메뉴 열기" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <line x1="4" y1="7" x2="20" y2="7"/>
          <line x1="4" y1="12" x2="20" y2="12"/>
          <line x1="4" y1="17" x2="20" y2="17"/>
        </svg>
      </button>
    </header>

    <main class="mobile-app__main mobile-app__main--inspection">
      <div class="mobile-insp__head">
        <h1 class="mobile-insp__title">정기안전점검</h1>
        <span class="mobile-insp__count" id="mobileInspCount">총 6건</span>
      </div>

      <div class="mobile-insp__filters" role="tablist" aria-label="점검 상태 필터">
        <button type="button" class="mobile-insp__filter is-active" data-filter="all" role="tab" aria-selected="true">전체</button>
        <button type="button" class="mobile-insp__filter" data-filter="progress" role="tab" aria-selected="false">작성중</button>
        <button type="button" class="mobile-insp__filter" data-filter="done" role="tab" aria-selected="false">완료</button>
      </div>

      <ul class="mobile-insp__list" id="mobileInspList" aria-live="polite"></ul>
    </main>

    <nav class="mobile-subnav" aria-label="점검 검색 방식">
      <button type="button" class="mobile-subnav__item mobile-subnav__item--active" data-subnav="progress">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M12 20h9"/>
          <path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/>
        </svg>
        작성중
      </button>
      <button type="button" class="mobile-subnav__item" data-subnav="location">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/>
          <circle cx="12" cy="10" r="3"/>
        </svg>
        위치기반
      </button>
      <button type="button" class="mobile-subnav__item" data-subnav="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <path d="M21 21l-4.35-4.35"/>
          <path d="M8 11h6M11 8v6"/>
        </svg>
        키워드 검색
      </button>
    </nav>
  </div>

  <div id="mobileDrawer" class="mobile-drawer" aria-hidden="true">
    <button type="button" class="mobile-drawer__backdrop" id="mobileDrawerBackdrop" aria-label="메뉴 닫기" tabindex="-1"></button>
    <aside class="mobile-drawer__panel" id="mobileDrawerPanel" role="dialog" aria-modal="true" aria-label="사이드 메뉴">
      <div class="mobile-drawer__profile">
        <span class="mobile-drawer__avatar" aria-hidden="true">한</span>
        <div class="mobile-drawer__user">
          <div class="mobile-drawer__user-line">
            <p class="mobile-drawer__org">한국항만협회</p>
            <span class="mobile-drawer__date" id="mobileDrawerDate">2026.05.15</span>
          </div>
          <div class="mobile-drawer__user-line mobile-drawer__user-line--bottom">
            <p class="mobile-drawer__role">시설물 담당자</p>
            <span class="mobile-drawer__status">
              <span class="mobile-drawer__status-dot" aria-hidden="true"></span>
              현재 접속중
            </span>
          </div>
        </div>
      </div>
      <nav class="mobile-drawer__nav" aria-label="계정 메뉴">
        <p class="mobile-drawer__label">계정</p>
        <ul class="mobile-drawer__menu">
          <li>
            <a href="#" class="mobile-drawer__link" data-mobile-soon>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              내 정보
            </a>
          </li>
          <li>
            <a href="#" class="mobile-drawer__link" data-mobile-soon>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
              </svg>
              알림 설정
            </a>
          </li>
          <li>
            <a href="#" class="mobile-drawer__link" data-mobile-soon>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                <circle cx="12" cy="12" r="3"/>
                <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
              </svg>
              앱 설정
            </a>
          </li>
        </ul>
      </nav>
      <div class="mobile-drawer__footer">
        <a href="login.html?logout=1" class="mobile-drawer__link mobile-drawer__logout" id="mobileLogout">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          로그아웃
        </a>
      </div>
    </aside>
  </div>

  <script src="../js/mobile-inspection-data.js"></script>
  <script src="../js/mobile-common.js"></script>
  <script src="../js/mobile-drawer.js"></script>
  <script src="../js/mobile-inspection.js"></script>
</body>
</html>
