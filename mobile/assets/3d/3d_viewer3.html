<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D Tiles Viewer (No Background)</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; }
        #cesiumContainer { width: 100%; height: 100vh; }
        .cesium-credit-logoContainer,
        .cesium-credit-textContainer,
        .cesium-widget-credits { display: none !important; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <script>
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IjNBMzdkN1EyN3JrNUZNUlYiLCJqdGkiOiJkMTdhNjdlNC01OTMxLTRjMzAtYWViOC05N2Q3NzkyNDUwMjUiLCJpZCI6NDg0MjQzLCJzdWIiOiJqamhfcG9tcyIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiJwb21zIiwiaWF0IjoxNzg4OTMwNzU5fQ.39tmcDGPCrBPrLOG4G5hcIeR2-2zAhZruk4WOZMs7n0';

        const viewer = new Cesium.Viewer('cesiumContainer', {
            baseLayerPicker: false,
            geocoder: false,
            homeButton: false,
            sceneModePicker: false,
            navigationHelpButton: false,
            animation: false,
            timeline: false,
            fullscreenButton: true,
            imageryProvider: false,
            baseLayer: false
        });

        // 배경을 검정 또는 어두운 색으로
        viewer.scene.backgroundColor = Cesium.Color.BLACK;
        viewer.scene.globe.show = false;
        viewer.scene.skyBox.show = false;
        viewer.scene.sun.show = false;
        viewer.scene.moon.show = false;
        viewer.scene.skyAtmosphere.show = false;

        async function loadTileset() {
            try {
                const tileset = await Cesium.Cesium3DTileset.fromUrl('./tileset.json');
                viewer.scene.primitives.add(tileset);
                await viewer.zoomTo(tileset);
                console.log('3D Tileset 로드 완료');
            } catch (error) {
                console.error('로드 실패:', error);
                alert('tileset.json 로드에 실패했습니다.\n로컬 서버(python -m http.server 8080)로 실행했는지 확인하세요.');
            }
        }

        let homeView = null;
        let homePending = false;

        function captureHome() {
            homeView = {
                destination: Cesium.Cartesian3.clone(viewer.camera.position),
                orientation: {
                    heading: viewer.camera.heading,
                    pitch: viewer.camera.pitch,
                    roll: viewer.camera.roll
                }
            };
        }

        function poms3dHome() {
            if (!homeView) {
                homePending = true;
                return;
            }
            viewer.camera.cancelFlight();
            viewer.camera.flyTo({
                destination: homeView.destination,
                orientation: homeView.orientation,
                duration: 0.7
            });
        }

        window.poms3dHome = poms3dHome;
        window.addEventListener('message', function (ev) {
            if (ev.data && ev.data.type === 'poms-3d-home') poms3dHome();
        });

        loadTileset().then(function () {
            captureHome();
            if (homePending) {
                homePending = false;
                poms3dHome();
            }
        });
    </script>
</body>
</html>
