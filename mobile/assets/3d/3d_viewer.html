<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>3D Tiles Viewer</title>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.121/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; }
        #cesiumContainer { width: 100%; height: 100vh; }
    </style>
</head>
<body>
    <div id="cesiumContainer"></div>
    <script>
        // Cesium Ion 토큰
        Cesium.Ion.defaultAccessToken = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJub25jZSI6IjNBMzdkN1EyN3JrNUZNUlYiLCJqdGkiOiJkMTdhNjdlNC01OTMxLTRjMzAtYWViOC05N2Q3NzkyNDUwMjUiLCJpZCI6NDg0MjQzLCJzdWIiOiJqamhfcG9tcyIsImlzcyI6Imh0dHBzOi8vYXBpLmNlc2l1bS5jb20iLCJhdWQiOiJwb21zIiwiaWF0IjoxNzg4OTMwNzU5fQ.39tmcDGPCrBPrLOG4G5hcIeR2-2zAhZruk4WOZMs7n0';

        const viewer = new Cesium.Viewer('cesiumContainer', {
            baseLayerPicker: true,
            geocoder: false,
            homeButton: true,
            sceneModePicker: false,
            navigationHelpButton: false,
            animation: false,
            timeline: false,
            fullscreenButton: true
        });

        // 3D Tileset 로드
        async function loadTileset() {
            try {
                const tileset = await Cesium.Cesium3DTileset.fromUrl('./tileset.json');
                viewer.scene.primitives.add(tileset);

                // 타일셋 위치로 카메라 이동
                await viewer.zoomTo(tileset);

                console.log('3D Tileset 로드 완료');
            } catch (error) {
                console.error('로드 실패:', error);
                alert('tileset.json 로드에 실패했습니다.\n로컬 서버(python -m http.server 8080)로 실행했는지 확인하세요.');
            }
        }

        loadTileset();
    </script>
</body>
</html>
