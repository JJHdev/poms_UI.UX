<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POMS 모바일 로그인</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap"
      rel="stylesheet">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">

<link rel="stylesheet" href="css/mobile_login.css">
</head>

<body>

<div class="phone">
    <div class="pi">

        <!-- 상태바 -->
        <div class="sbar">
            <!-- <span class="sbar-t">12:00</span>

            <div class="sbar-ic">
                <i class="ti ti-antenna-bars-5"></i>
                <i class="ti ti-wifi"></i>
                <i class="ti ti-battery-2"></i>
            </div> -->
        </div>

        <!-- 해양수산부 로고 -->
        <div class="ministry-logo">
            <img
                src="assets/main/logo_bg.png"
                alt="해양수산부">

            <span>해양수산부</span>
        </div>

        <!-- 서비스 제목 -->
        <div class="hero">
            <div class="app-sub">
                항만시설물 유지관리 시스템 모바일
            </div>

            <div class="app-name">
                항만시설 지킴이
            </div>
        </div>

        <!-- 로그인 입력 영역 -->
        <div class="form-area">

            <div class="field">
                <input
                    id="userId"
                    class="field-inp"
                    type="text"
                    placeholder="아이디"
                    autocomplete="username">
            </div>

            <div class="field">
                <input
                    id="password"
                    class="field-inp"
                    type="password"
                    placeholder="비밀번호"
                    autocomplete="current-password">

                <button
                    type="button"
                    class="password-eye"
                    aria-label="비밀번호 표시"
                    onclick="togglePassword()">

                    <i id="passwordIcon" class="ti ti-eye"></i>
                </button>
            </div>

            <p id="loginError" class="login-error" hidden role="alert"></p>

            <button
                type="button"
                class="login-btn"
                onclick="submitMobileLogin()">
                로그인
            </button>

            <div class="login-options">

                <label class="save-label">
                    <input id="saveId" type="checkbox" checked>

                    <span class="save-chk">
                        <i class="ti ti-check"></i>
                    </span>

                    <span>아이디 저장</span>
                </label>

                <!-- <span class="option-divider"></span> -->

                <!-- <button
                    type="button"
                    class="find-password"
                    onclick="findPassword()">
                    비밀번호 찾기
                </button> -->

            </div>

        </div>

        <!-- 공지사항 -->
        <div class="notice-wrap">

            <div
                class="notice-card"
                onclick="openNotice()">

                <div class="nc-icon">
                    <i class="ti ti-bell"></i>
                </div>

                <div class="nc-content">

                    <div class="nc-title" style="word-break: keep-all;">
                        항만시설물 안전점검 제출 관련하여 문의사항은 항만협회로 연락바랍니다.
                    </div>

                    <div class="nc-body">
                        02 - 2165 - 0146
                    </div>

                </div>

            </div>

        </div>

        <!-- 하단 -->
        <div class="app-footer">
            <div class="af-copy">
                &copy; Ministry of Oceans and Fisheries
            </div>
        </div>

    </div>
</div>

<script src="js/mobile_login.js?v=accounts3"></script>
<script>
/* 로그인 후 뒤로가기로 로그인 화면이 다시 보이지 않게 — 이미 로그인 상태면 메인으로 (기록 남기지 않음) */
window.addEventListener('pageshow', function () {
  try { if (sessionStorage.getItem('pomsMobileIn') === 'Y') location.replace('mobile_main.html'); } catch (e) {}
});
</script>

</body>
</html>
