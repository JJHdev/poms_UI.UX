<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>공지사항 | POMS 관리자</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/admin-topnav.css">
  <link rel="stylesheet" href="css/admin-mock.css">
  <link rel="stylesheet" href="css/pagination.css">
  <link rel="stylesheet" href="css/admin-notices.css">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1240px; }
  </style>
</head>
<body class="app-layout admin-notices-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="ntc-page" aria-label="공지사항 관리">

        <div class="ntc-section-title">
          <span class="ntc-section-title__icon" aria-hidden="true">
            <img src="assets/main/facility-search/icon-condition.svg" alt="" width="24" height="24">
          </span>
          <h1 class="ntc-section-title__text">검색조건</h1>
        </div>

        <section class="ntc-filter-strip" aria-label="검색조건">
          <form class="ntc-filter" id="noticeSearchForm" role="search" novalidate>
            <div class="ntc-field ntc-field--title">
              <label for="noticeAdminSearch">제목</label>
              <input
                type="search"
                id="noticeAdminSearch"
                name="title"
                placeholder="검색어를 입력하세요."
                autocomplete="off"
              >
            </div>
            <div class="ntc-filter-actions">
              <button type="submit" class="ntc-btn ntc-btn--search">
                <img src="assets/main/facility-statistics/icon-search.svg" alt="" width="18" height="18">
                검색하기
              </button>
              <button type="button" class="ntc-btn ntc-btn--reset" id="noticeResetBtn">
                <img src="assets/main/facility-search/icon-reset.svg" alt="" width="18" height="18">
                초기화
              </button>
            </div>
          </form>
        </section>

        <section class="ntc-results" aria-labelledby="noticeResultsTitle">
          <div class="ntc-results__head">
            <div class="ntc-results__count">
              <span class="ntc-results__bar-icon" aria-hidden="true">
                <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="14" height="14">
              </span>
              <h2 id="noticeResultsTitle" class="ntc-results__label">검색결과</h2>
              <p class="ntc-results__meta">총 <strong id="noticeResultCount">0</strong>건</p>
            </div>
            <button type="button" class="ntc-btn ntc-btn--create" id="btnNoticeInsert">
              <img src="assets/main/archive-safety/icon-plus-dark.svg" alt="" width="18" height="18">
              공지 등록
            </button>
          </div>

          <div class="ntc-table-wrap">
            <table class="ntc-table" aria-label="공지사항 검색결과">
              <thead>
                <tr>
                  <th scope="col" class="notice-col-no">번호</th>
                  <th scope="col" class="notice-col-title">제목</th>
                  <th scope="col" class="notice-col-date">작성일</th>
                  <th scope="col" class="notice-col-date">수정일</th>
                  <th scope="col" class="notice-col-author">작성자</th>
                  <th scope="col" class="notice-col-pin">상단고정</th>
                  <th scope="col" class="notice-col-visible">노출여부</th>
                </tr>
              </thead>
              <tbody id="noticeAdminBody"></tbody>
            </table>
          </div>

          <div class="ntc-results-foot">
            <nav class="pagination" id="noticePagination" aria-label="페이지 이동"></nav>
          </div>
        </section>
    </div>
  </main>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar-admin.js"></script>
  <script src="js/pagination.js"></script>
  <script src="js/admin-notices.js"></script>
  <script>
    PomsSidebarAdmin.mount('#sidebar-root', { active: 'board-notice' });

    /* 상단고정 / 노출여부 셀을 시안 배지 형태로 정규화 */
    (function () {
      var tbody = document.getElementById('noticeAdminBody');
      if (!tbody) { return; }

      function normalize() {
        Array.prototype.forEach.call(tbody.rows, function (tr) {
          var pin = tr.cells[5];
          var vis = tr.cells[6];

          if (pin) {
            var pinText = (pin.textContent || '').trim();
            var pinned = pinText === '고정' || pinText === 'Y';
            pin.innerHTML = pinned
              ? '<span class="notice-pin-text">고정</span>'
              : '<span class="notice-pin-text is-off">-</span>';
          }

          if (vis) {
            var visText = (vis.textContent || '').trim();
            var hidden = visText.charAt(0) === '미' || visText === 'N';
            vis.innerHTML = '<span class="notice-stat-badge' + (hidden ? ' is-off' : '') + '">'
              + (hidden ? '미표출' : '표출') + '</span>';
          }
        });
      }

      if (window.MutationObserver) {
        new MutationObserver(normalize).observe(tbody, { childList: true });
      }
      normalize();
    })();
  </script>
</body>
</html>
