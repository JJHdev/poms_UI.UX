<body class="app-layout notice-detail-page">
  <div id="sidebar-root"></div>

    </header>

    <div class="notice-detail-toolbar">
      <a href="maintenance-plan.html" class="btn-notice-back">

    <article class="notice-detail-card">

        <colgroup>
          <col class="col-label">
          <col class="col-value">
          <col class="col-label">
          <col class="col-value">

              <div class="notice-detail-title" id="maintenanceDetailTitle">

            </td>
          </tr>
          <tr>
            <th scope="row">작성자</th>
            <td data-field="author">관리자</td>
            <th scope="row">작성일</th>
            <td data-field="date">2026-05-18 10:00</td>
            <th scope="row">조회수</th>
            <td data-field="views">412</td>

          <tr>

          </tr>
        </tbody>
      </table>

      <div class="notice-body" id="maintenancePlanDetailBody">
