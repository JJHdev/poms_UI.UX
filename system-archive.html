<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시스템 자료실 | POMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar2.css">
  <link rel="stylesheet" href="css/facility-change-request.css">
  <link rel="stylesheet" href="css/archive-notice.css">
  <style>
    body { font-family: "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1280px; }
    .archive-notice-page .fcr-table .col-category { width: 90px; }
  </style>
  <link rel="stylesheet" href="css/pagination.css?v=20260812p">
</head>
<body class="app-layout facility-change-request-page archive-notice-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <header class="page-header">
      <div class="page-header__bar">
        <div class="page-header__titles">
          <h1 class="page-title">시스템 자료실</h1>
          <nav class="breadcrumb" aria-label="현재 위치">
            <a href="archive.html">자료실</a>
            <span class="breadcrumb__sep" aria-hidden="true">&gt;</span>
            <span class="breadcrumb__current">시스템 자료실</span>
          </nav>
        </div>
      </div>
    </header>

    <div class="fcr-page">
      <div class="fcr-card">
        <section class="fcr-filter-panel" aria-labelledby="archiveMatFilterTitle">
          <div class="fcr-filter-panel__head">
            <span class="fcr-filter-panel__title-icon" aria-hidden="true">
              <img src="assets/main/facility-search/icon-condition.svg" alt="" width="24" height="24">
            </span>
            <h2 id="archiveMatFilterTitle" class="fcr-filter-panel__title">검색조건</h2>
          </div>
          <form id="archiveMatSearchForm" class="fcr-filter" role="search" novalidate>
            <div class="fcr-filter-row">
              <div class="fcr-field fcr-field--grow">
                <label for="archiveMatSearch">검색어</label>
                <input type="text" id="archiveMatSearch" name="keyword" placeholder="제목을 입력하세요." autocomplete="off">
              </div>
                <button type="submit" class="fcr-btn fcr-btn--search" id="archiveMatSearchBtn">
                  <img src="assets/main/facility-statistics/icon-search.svg" alt="" width="18" height="18">
                  검색하기
                </button>
                <div class="fcr-filter-actions">
                <button type="button" class="fcr-btn fcr-btn--reset" id="archiveMatResetBtn">
                  <img src="assets/main/facility-search/icon-reset.svg" alt="" width="18" height="18">
                  초기화
                </button>
              </div>
            </div>
          </form>
        </section>

        <div class="fcr-divider" aria-hidden="true"></div>

        <section class="fcr-results-panel" aria-labelledby="archiveMatResultTitle">
          <div class="fcr-results__head">
            <div class="fcr-results__count">
              <h2 id="archiveMatResultTitle" class="fcr-results__label">검색결과</h2>
              <p class="fcr-results__meta">총 <strong id="archiveMatResultCount">0</strong>건</p>
            </div>
          </div>
          <div class="fcr-table-wrap">
            <table class="fcr-table archive-notice-table" aria-label="시스템 자료실 조회결과">
              <thead>
                <tr>
                  <th scope="col" class="col-no">번호</th>
                  <th scope="col" class="col-category">구분</th>
                  <th scope="col" class="col-title">제목</th>
                  <th scope="col" class="col-author">작성자</th>
                  <th scope="col" class="col-date">작성일</th>
                  <th scope="col" class="col-views">조회수</th>
                </tr>
              </thead>
              <tbody id="archiveMatTableBody"></tbody>
            </table>
          </div>
          <div class="fcr-results-foot">
            <nav class="pagination" id="archiveMatPagination" aria-label="페이지 이동"></nav>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/user-table-utils.js"></script>
  <script src="js/archive-materials-data.js"></script>
  <script src="js/system-archive-page.js"></script>
</body>
</html>
