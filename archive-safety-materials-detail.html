<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>안전점검 관련자료 상세 | POMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar2.css">
  <link rel="stylesheet" href="css/facility-detail.css">
  <link rel="stylesheet" href="css/facility-add.css">
  <link rel="stylesheet" href="css/type3-port-facility.css">
  <link rel="stylesheet" href="css/facility-change-request-detail.css?v=24">
  <link rel="stylesheet" href="css/archive-notice.css?v=4">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1280px; }
  </style>
</head>
<body class="app-layout facility-detail-page facility-change-request-detail-page archive-notice-detail-page archive-materials-detail-page type3-port-page fcr-detail-flat-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="type3-page" aria-label="안전점검 관련자료 상세">
      <header class="page-header">
        <div class="page-header__nav">
          <a href="archive-safety-materials.html" class="btn-back" id="materialsDetailBackBtn" aria-label="목록으로">
            <span class="ico-angle" aria-hidden="true">
              <span class="ico-angle__vec">
                <img src="assets/main/facility-search/detail/figma224/icon-angle-down.svg" alt="">
              </span>
            </span>
          </a>
          <a href="archive.html" class="page-header__home" aria-label="자료실 홈">
            <span class="page-header__home-icon" aria-hidden="true">
              <span class="page-header__home-icon-roof"><img src="assets/main/facility-search/detail/figma224/icon-home-roof.svg" alt=""></span>
              <span class="page-header__home-icon-body"><img src="assets/main/facility-search/detail/figma224/icon-home-body.svg" alt=""></span>
              <span class="page-header__home-icon-door"><img src="assets/main/facility-search/detail/figma224/icon-home-door.svg" alt=""></span>
            </span>
          </a>
        </div>
        <nav class="breadcrumb" aria-label="현재 위치">
          <a href="archive.html">자료실</a>
          <span class="breadcrumb__sep" aria-hidden="true">&gt;</span>
          <a href="archive-safety-materials.html">게시판</a>
          <span class="breadcrumb__sep" aria-hidden="true">&gt;</span>
          <span class="breadcrumb__current" id="materialsDetailCrumb">게시판 상세</span>
        </nav>
      </header>

      <div class="detail-shell">
        <section class="detail-section" aria-labelledby="materialsDetailSectionTitle">
          <div class="detail-section__head">
            <div class="type3-section-title">
              <span class="type3-section-title__icon" aria-hidden="true">
                <img src="assets/main/facility-statistics/figma188/icon-title-clean.svg" alt="" width="24" height="24">
              </span>
              <h3 class="detail-section__title" id="materialsDetailSectionTitle">자료 상세</h3>
            </div>
            <p class="detail-section__note">※ 자료의 제목·내용·첨부파일을 확인합니다.</p>
          </div>

          <div class="fac-add-body notice-detail-body">
            <div class="fac-add-grid notice-detail-grid">
              <div class="fac-add-field fac-add-field--full">
                <div class="fac-add-field__label">제목</div>
                <div class="fac-add-field__control">
                  <input type="text" class="fac-add-input" id="materialsDetailTitle" readonly>
                </div>
              </div>

              <div class="fac-add-field fac-add-field--full">
                <div class="fac-add-field__label">등록일</div>
                <div class="fac-add-field__control">
                  <input type="text" class="fac-add-input" id="materialsDetailDate" readonly>
                </div>
              </div>

              <div class="fac-add-field fac-add-field--full notice-detail-field--content">
                <div class="fac-add-field__label">내용</div>
                <div class="fac-add-field__control">
                  <div class="fac-add-input notice-detail-content" id="materialsDetailDesc"></div>
                </div>
              </div>

              <div class="fac-add-field fac-add-field--full">
                <div class="fac-add-field__label">첨부파일</div>
                <div class="fac-add-field__control notice-detail-file">
                  <div class="notice-file-picker" id="materialsDetailFileWrap">
                    <img src="assets/main/facility-form/icon-file.svg" alt="" width="18" height="18">
                    <a href="#" class="notice-file-link is-empty" id="materialsDetailFile">첨부된 파일 없음</a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/archive-safety-materials.js"></script>
</body>
</html>
