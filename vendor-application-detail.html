  <link rel="stylesheet" href="css/sidebar.css">

  <link rel="stylesheet" href="css/facility-management-detail.css">
  <link rel="stylesheet" href="css/facility-change-approval.css">

  <style>

</head>
<body class="app-layout facility-detail-page facility-change-approval-page vendor-application-detail-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="fmd-crumb-row">
      <button type="button" class="fmd-back-btn" id="requestDetailBackBtn" aria-label="목록으로">
        <img src="assets/main/facility-statistics/figma188/icon-angle-down-clean.svg" alt="" width="16" height="16">
      </button>
      <a href="inspection-result-manage.html" class="fmd-home-btn" aria-label="점검결과 등록관리 목록">
        <img src="assets/main/facility-statistics/figma188/icon-home-clean.svg" alt="" width="18" height="18">
      </a>
      <nav class="fmd-breadcrumb" aria-label="현재 위치">
        <a href="inspection-result-manage.html">용역사 관리</a>
        <span class="fmd-breadcrumb__sep" aria-hidden="true"> &gt; 점검결과 등록관리 &gt; </span>
        <span class="fmd-breadcrumb__current">시설물신청 상세</span>
      </nav>
    </div>

    <div class="admin-detail-title-row">
      <div class="admin-detail-title-row__lead">
        <h1 class="admin-detail-title-row__title">시설물신청 상세</h1>
      </div>
      <div class="admin-detail-title-row__actions">
        <button type="button" class="fmd-btn fmd-btn--history" id="requestModalProcessButton">
          <img src="assets/service/main/figma/icon-history.svg" alt="" width="18" height="18">
          결재이력
        </button>
        <button type="button" class="fmd-btn vad-approve-btn" id="requestApproveButton">
          승인
        </button>
        <button type="button" class="fmd-btn vad-reject-btn" id="requestRejectButton">
          반려
        </button>
      </div>
    </div>

    <div class="fmd-stack">
      <section class="fmd-panel" aria-labelledby="requestDetailTitle">
        <div class="fmd-panel__head">
          <span class="fmd-panel__title-icon" aria-hidden="true">
            <img src="assets/main/facility-search/icon-condition.svg" alt="" width="24" height="24">
          </span>
          <h2 class="fmd-panel__title" id="requestDetailTitle">용역 신청 정보</h2>
          <p class="vad-panel__note" id="requestDetailSub"></p>
        </div>
        <div class="fmd-panel__body">
          <form id="requestModalForm" class="vad-form" autocomplete="off">
            <div class="vad-meta-grid" aria-labelledby="requestModalServiceTitle">
              <span class="visually-hidden" id="requestModalServiceTitle">용역 신청 정보</span>

              <div class="vad-meta__row">
                <div class="vad-meta__label">용역명</div>
                <div class="vad-meta__value" id="requestModalServiceName"></div>
              </div>
              <div class="vad-meta__row">
                <div class="vad-meta__label">발주처</div>
                <div class="vad-meta__value" id="requestModalManageName"></div>
              </div>

              <div class="vad-meta__row">
                <div class="vad-meta__label">담당자 성명</div>
                <div class="vad-meta__value" id="requestModalContactName"></div>
              </div>
              <div class="vad-meta__row">
                <div class="vad-meta__label">담당자 직책</div>
                <div class="vad-meta__value" id="requestModalContactPosition"></div>
              </div>

              <div class="vad-meta__row">
                <div class="vad-meta__label">담당자 연락처</div>
                <div class="vad-meta__value" id="requestModalContactTel"></div>
              </div>
              <div class="vad-meta__row">
                <div class="vad-meta__label">계약서</div>
                <div class="vad-meta__value" id="requestModalContractFile"></div>
              </div>

              <div class="vad-meta__row">
                <div class="vad-meta__label">과업지시서</div>
                <div class="vad-meta__value" id="requestModalOrderFile"></div>
              </div>
              <div class="vad-meta__row">
                <div class="vad-meta__label">기타</div>
                <div class="vad-meta__value" id="requestModalEtcFile"></div>
              </div>

              <div class="vad-meta__row">
                <div class="vad-meta__label">사용자 ID</div>
                <div class="vad-meta__value">
                  <input type="text" class="vad-meta__input" id="requestModalUserId" readonly>
                </div>
              </div>
              <div class="vad-meta__row">
                <div class="vad-meta__label">검토상태</div>
                <div class="vad-meta__value">
                  <span class="vad-review-status is-pending" id="requestReviewStatus">검토중</span>
                  <select class="vad-meta__select vad-meta__select--compat" id="requestModalPermitStatus" aria-hidden="true" tabindex="-1">
                    <option value="">검토중</option>
                    <option value="Y">승인</option>
                    <option value="N">반려</option>
                  </select>
                </div>
              </div>

              <!-- 3열 격자를 채우기 위한 빈 칸 -->
              <div class="vad-meta__row vad-meta__row--filler" aria-hidden="true"></div>
              <div class="vad-meta__row vad-meta__row--filler" aria-hidden="true"></div>
            </div>
          </form>
        </div>
      </section>

      <section class="fmd-panel" aria-labelledby="requestModalFacilitiesTitle">
        <div class="fmd-panel__head">
          <span class="fmd-panel__title-icon" aria-hidden="true">
            <img src="assets/main/facility-management/icon-section-facility.svg" alt="" width="24" height="24">
          </span>
          <h2 class="fmd-panel__title" id="requestModalFacilitiesTitle">신청 시설물 목록</h2>
          <p class="vad-panel__note">신청 <strong id="requestModalFacilityCount">0</strong>개</p>
        </div>
        <div class="fmd-panel__body">
          <div class="vad-table-wrap">
            <table class="vad-table" aria-label="신청 시설물 목록">
              <thead>
                <tr>
                  <th scope="col">번호</th>
                  <th scope="col">항만구분</th>
                  <th scope="col">관리구분</th>
                  <th scope="col">관리기관</th>
                  <th scope="col">해역</th>
                  <th scope="col">항명</th>
                  <th scope="col">세부항명</th>
                  <th scope="col">시설구분</th>
                  <th scope="col">시설명</th>
                </tr>
              </thead>
              <tbody id="requestModalFacilityBody"></tbody>
            </table>
          </div>
          <div class="vad-facility-foot" id="requestFacilityFoot" hidden>
            <nav class="pagination" id="requestFacilityPagination" aria-label="신청 시설물 페이지 이동"></nav>
            <label class="visually-hidden" for="requestFacilityPageSize">페이지당 표시 건수</label>
            <select id="requestFacilityPageSize" class="pagination-page-size" aria-label="페이지당 표시 건수" hidden>
              <option value="10" selected>10 / page</option>
            </select>
          </div>
        </div>
      </section>
    </div>
  </main>


  <div class="vad-reject-modal" id="requestRejectModal" aria-hidden="true">
    <div class="vad-reject-dialog" role="dialog" aria-modal="true" aria-labelledby="requestRejectTitle">
      <div class="vad-reject-head">
        <h2 class="vad-reject-title" id="requestRejectTitle">반려 사유 입력</h2>
        <button type="button" class="vad-reject-close" id="requestRejectClose" aria-label="닫기">×</button>
      </div>
      <div class="vad-reject-body">
        <label class="vad-reject-label" for="requestRejectReason">
          <span class="req">*</span> 반려 사유
        </label>
        <textarea
          class="vad-reject-textarea"
          id="requestRejectReason"
          placeholder="반려 사유를 입력해 주세요."
        ></textarea>
      </div>
      <div class="vad-reject-actions">
        <button type="button" class="vad-reject-cancel" id="requestRejectCancel">취소</button>
        <button type="button" class="vad-reject-submit" id="requestRejectSubmit">반려</button>
      </div>
    </div>
  </div>

  <div class="fca-drawer-overlay" id="requestDrawerOverlay"></div>
  <aside class="fca-drawer" id="requestDrawer" aria-labelledby="requestDrawerTitle" aria-hidden="true">
    <div class="fca-drawer__top">
      <header class="fca-drawer__head">
        <h2 class="fca-drawer__title" id="requestDrawerTitle">결재이력 조회</h2>
        <button type="button" class="fca-drawer__close" id="requestDrawerClose" aria-label="닫기">
          <img src="assets/facility-change-approval/icon-close.png" alt="" width="16" height="16">
        </button>
      </header>
      <div class="fca-drawer__body" id="requestDrawerBody"></div>
    </div>
  </aside>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar-admin.js"></script>
  <script src="js/admin-mock.js"></script>
  <script src="js/pagination.js"></script>
  <script src="js/vendor-application-data.js"></script>
  <script src="js/vendor-application-detail.js"></script>

  <script>
    (() => {
      const approveBtn = document.getElementById('requestApproveButton');
      const rejectBtn = document.getElementById('requestRejectButton');
      const rejectModal = document.getElementById('requestRejectModal');
      const rejectClose = document.getElementById('requestRejectClose');
      const rejectCancel = document.getElementById('requestRejectCancel');
      const rejectSubmit = document.getElementById('requestRejectSubmit');
      const rejectReason = document.getElementById('requestRejectReason');
      const reviewStatus = document.getElementById('requestReviewStatus');

      function setStatus(type, text) {
        if (reviewStatus) {
          reviewStatus.classList.remove('is-pending', 'is-approved', 'is-rejected');
          reviewStatus.classList.add(type);
          reviewStatus.textContent = text;
        }

        const permitStatus = document.getElementById('requestModalPermitStatus');
        if (permitStatus) {
          permitStatus.value = type === 'is-approved' ? 'Y' : type === 'is-rejected' ? 'N' : '';
        }
      }

      function openRejectModal() {
        if (!rejectModal) return;
        rejectReason.value = '';
        rejectModal.classList.add('open');
        rejectModal.setAttribute('aria-hidden', 'false');
        setTimeout(() => rejectReason?.focus(), 0);
      }

      function closeRejectModal() {
        if (!rejectModal) return;
        rejectModal.classList.remove('open');
        rejectModal.setAttribute('aria-hidden', 'true');
      }

      approveBtn?.addEventListener('click', () => {
        if (!confirm('해당 시설물 신청을 승인하시겠습니까?')) return;
        setStatus('is-approved', '승인');
        alert('승인 처리되었습니다. (샘플)');
      });

      rejectBtn?.addEventListener('click', openRejectModal);
      rejectClose?.addEventListener('click', closeRejectModal);
      rejectCancel?.addEventListener('click', closeRejectModal);

      rejectModal?.addEventListener('click', (event) => {
        if (event.target === rejectModal) closeRejectModal();
      });

      rejectSubmit?.addEventListener('click', () => {
        const reason = rejectReason?.value.trim() || '';
        if (!reason) {
          alert('반려 사유를 입력해 주세요.');
          rejectReason?.focus();
          return;
        }

        setStatus('is-rejected', '반려');
        closeRejectModal();
        alert('반려 처리되었습니다. (샘플)\\n반려 사유: ' + reason);
      });

      document.addEventListener('keydown', (event) => {
        if (event.key === 'Escape' && rejectModal?.classList.contains('open')) {
          closeRejectModal();
        }
      });
    })();
  </script>

</body>
</html>
