<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FMS 연계이력 | POMS 관리자</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/admin-topnav.css">
  <link rel="stylesheet" href="css/pagination.css?v=20260810e">
  <link rel="stylesheet" href="css/facility-change-request.css">
  <link rel="stylesheet" href="css/type3-port-facility.css">
  <link rel="stylesheet" href="css/facility-change-request-flat.css">
  <link rel="stylesheet" href="css/safety-report-approval.css?v=20260810a">
  <link rel="stylesheet" href="css/fms-history.css?v=20260818d">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1240px; }
  </style>
</head>
<body class="app-layout facility-change-request-page type3-port-page fcr-flat-page fms-history-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="type3-page" aria-label="FMS 연계이력">
      <div class="type3-section-title">
        <span class="type3-section-title__icon" aria-hidden="true">
          <img src="assets/main/facility-search/icon-condition.svg" alt="" width="24" height="24">
        </span>
        <h1 class="type3-section-title__text">검색조건</h1>
      </div>

      <section class="type3-filter-strip" aria-label="검색조건">
        <form class="type3-filter type3-filter--strip" id="fmsSearchForm" novalidate>
          <div class="type3-filter__fields fms-filter-fields">
            <div class="type3-field type3-field--grow">
              <label for="fmsFacilityFilter">시설물</label>
              <input type="text" id="fmsFacilityFilter" name="facility" placeholder="시설물을 입력하세요." autocomplete="off">
            </div>
            <div class="type3-field type3-field--range">
              <label>연계일자</label>
              <div class="fms-date-range">
                <input type="date" id="fmsDateFrom" name="dateFrom" value="2026-05-01" aria-label="연계일자 시작">
                <em>~</em>
                <input type="date" id="fmsDateTo" name="dateTo" value="2026-05-24" aria-label="연계일자 종료">
              </div>
            </div>
            <div class="type3-field type3-field--sm">
              <label for="fmsMatchFilter">매칭유무</label>
              <select id="fmsMatchFilter" name="match">
                <option value="">전체</option>
                <option value="매칭">매칭</option>
                <option value="비매칭">비매칭</option>
              </select>
            </div>
            <div class="type3-field">
              <label for="fmsNoFilter">시설물번호</label>
              <input type="text" id="fmsNoFilter" name="fmsNo" placeholder="FMS 시설물번호" autocomplete="off">
            </div>
          </div>
          <div class="type3-filter-actions">
            <button type="submit" class="type3-btn type3-btn--search" data-fms-action="search">
              <img src="assets/main/facility-statistics/icon-search.svg" alt="" width="18" height="18">
              검색하기
            </button>
            <button type="button" class="type3-btn type3-btn--reset" data-reset-filter data-fms-action="reset">
              <img src="assets/main/facility-search/icon-reset.svg" alt="" width="18" height="18">
              초기화
            </button>
          </div>
        </form>
      </section>

      <section class="type3-results-panel" aria-labelledby="fmsResultTitle">
        <div class="type3-results__head">
          <div class="type3-results__count">
            <span class="type3-results__bar-icon" aria-hidden="true">
              <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="8" height="14">
            </span>
            <h2 id="fmsResultTitle" class="type3-results__label">검색결과</h2>
            <p class="type3-results__meta">총 <strong id="fmsResultCount">0</strong>건</p>
          </div>
          <button type="button" class="type3-btn type3-btn--excel fms-excel-btn" data-fms-action="excel">
            <img src="assets/main/facility-statistics/icon-excel.svg" alt="" width="18" height="18">
            엑셀 다운로드
          </button>
        </div>

        <div class="type3-table-wrap">
          <table class="type3-table fms-table" id="fmsLinkTable" aria-label="FMS 연계이력 목록">
            <colgroup>
              <col class="col-no">
              <col class="col-fmsno">
              <col class="col-fmsname">
              <col class="col-pomsname">
              <col class="col-match">
              <col class="col-view">
              <col class="col-hist">
              <col class="col-date">
            </colgroup>
            <thead>
              <tr>
                <th scope="col">번호</th>
                <th scope="col">(FMS)시설물번호</th>
                <th scope="col">(FMS)시설물명</th>
                <th scope="col">(POMS)시설물명</th>
                <th scope="col">데이터매칭</th>
                <th scope="col">데이터보기</th>
                <th scope="col">데이터변경이력</th>
                <th scope="col">연계일자</th>
              </tr>
            </thead>
            <tbody id="fmsLinkBody"></tbody>
          </table>
        </div>

        <div class="type3-results-foot">
          <nav class="pagination" id="fmsPagination" aria-label="페이지 이동"></nav>
          <label class="visually-hidden" for="fmsPageSize">페이지당 표시 건수</label>
          <select id="fmsPageSize" class="pagination-page-size" aria-label="페이지당 표시 건수" hidden>
            <option value="10">10 / page</option>
            <option value="20">20 / page</option>
            <option value="50">50 / page</option>
          </select>
        </div>
      </section>
    </div>
  </main>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar-admin.js"></script>
  <script src="js/admin-mock.js"></script>
  <script src="js/pagination.js"></script>
  <script src="js/fms-history-data.js"></script>
  <script src="js/fms-history.js"></script>
  <script>
    PomsSidebarAdmin.mount('#sidebar-root', { active: 'link-fms' });
  </script>
</body>
</html>
