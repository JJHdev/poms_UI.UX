<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>책임기술자 등록 | POMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/admin-topnav.css">
  <link rel="stylesheet" href="css/facility-management-detail.css">
  <link rel="stylesheet" href="css/facility-search.css">
  <link rel="stylesheet" href="css/responsible-engineer-detail.css">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1240px; }
  </style>
</head>
<body class="app-layout facility-detail-page fmd-figma-page facility-search-page engineer-detail-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="fs-layout">
      <aside class="fs-lnb" aria-label="시스템 관리 메뉴">
        <div class="fs-lnb__title">
          <h2 class="fs-lnb__title-text">시스템 관리</h2>
        </div>
        <nav class="fs-lnb__nav" data-admin-sub-tabs="1" aria-label="시스템 관리 하위 메뉴">
          <a href="facility-management.html" class="fs-lnb__item">
            <span>시설물 관리</span>
            <span class="fs-lnb__chevron" aria-hidden="true">›</span>
          </a>
          <a href="maintenance-plan-manage.html" class="fs-lnb__item">
            <span>유지관리계획 관리</span>
            <span class="fs-lnb__chevron" aria-hidden="true">›</span>
          </a>
          <a href="mooring-facility-management.html" class="fs-lnb__item">
            <span>계류시설 관리</span>
            <span class="fs-lnb__chevron" aria-hidden="true">›</span>
          </a>
          <a href="facility-location-status.html" class="fs-lnb__item">
            <span>시설물 위치 현황 관리</span>
            <span class="fs-lnb__chevron" aria-hidden="true">›</span>
          </a>
          <a href="drone-video-management.html" class="fs-lnb__item">
            <span>드론 영상관리</span>
            <span class="fs-lnb__chevron" aria-hidden="true">›</span>
          </a>
          <a href="responsible-engineer.html" class="fs-lnb__item is-active" aria-current="page">
            <span>책임기술자 관리</span>
            <span class="fs-lnb__chevron" aria-hidden="true">›</span>
          </a>
        </nav>
      </aside>

      <div class="fmd-page fs-manage" aria-label="책임기술자 관리">
        <div class="fmd-crumb-row">
          <button type="button" class="fmd-back-btn" id="engineerDetailBackBtn" aria-label="목록으로">
            <img src="assets/main/facility-statistics/figma188/icon-angle-down-clean.svg" alt="" width="16" height="16">
          </button>
          <a href="responsible-engineer.html" class="fmd-home-btn" aria-label="책임기술자 관리 목록">
            <img src="assets/main/facility-statistics/figma188/icon-home-clean.svg" alt="" width="18" height="18">
          </a>
          <nav class="fmd-breadcrumb" aria-label="현재 위치">
            <a href="facility-management.html">시스템 관리</a>
            <span class="fmd-breadcrumb__sep" aria-hidden="true"> &gt; 책임기술자 관리 &gt; </span>
            <span class="fmd-breadcrumb__current" id="engineerDetailCrumb">책임기술자 등록</span>
          </nav>
        </div>

        <form id="engineerForm" class="fmd-stack" novalidate>
          <section class="fmd-section" aria-labelledby="engineerDetailPageTitle">
            <div class="fmd-section__head">
              <span class="fmd-section__icon" aria-hidden="true">
                <img src="assets/main/facility-management/icon-section-facility.svg" alt="" width="24" height="24">
              </span>
              <h1 class="fmd-section__title" id="engineerDetailPageTitle">책임기술자 등록</h1>
            </div>

            <div class="fmd-section__body">
              <table class="eng-info-table" aria-label="책임기술자 정보">
                <colgroup>
                  <col class="eng-info-table__label">
                  <col>
                  <col class="eng-info-table__label">
                  <col>
                </colgroup>
                <tbody>
                  <tr>
                    <th scope="row"><span class="req">*</span> 성명</th>
                    <td>
                      <input type="text" class="fmd-input" id="engineerFormName" name="name" required placeholder="성명을 입력하세요.">
                    </td>
                    <th scope="row"><span class="req">*</span> 소속</th>
                    <td>
                      <input type="text" class="fmd-input" id="engineerFormOrg" name="organization" required placeholder="소속을 입력하세요.">
                    </td>
                  </tr>
                  <tr>
                    <th scope="row">담당부서</th>
                    <td>
                      <input type="text" class="fmd-input" id="engineerFormDept" name="department" placeholder="담당부서를 입력하세요.">
                    </td>
                    <th scope="row"><span class="req">*</span> 구분</th>
                    <td>
                      <select class="fmd-select" id="engineerFormCategory" name="category" required>
                        <option value="">선택</option>
                        <option value="책임">책임</option>
                        <option value="참여">참여</option>
                        <option value="기타">기타</option>
                      </select>
                    </td>
                  </tr>
                  <tr>
                    <th scope="row">분야</th>
                    <td>
                      <input type="text" class="fmd-input" id="engineerFormField" name="field" placeholder="분야를 입력하세요.">
                    </td>
                    <th scope="row">경력</th>
                    <td>
                      <input type="text" class="fmd-input" id="engineerFormCareer" name="career" placeholder="예: 15년">
                    </td>
                  </tr>
                  <tr>
                    <th scope="row">교육이수여부</th>
                    <td>
                      <select class="fmd-select" id="engineerFormEduStatus" name="eduStatus">
                        <option value="">선택</option>
                        <option value="O">O</option>
                        <option value="X">X</option>
                      </select>
                    </td>
                    <th scope="row">교육이수일자</th>
                    <td>
                      <input type="date" class="fmd-input" id="engineerFormEduDate" name="eduDate">
                    </td>
                  </tr>
                  <tr>
                    <th scope="row">건설기술인협회</th>
                    <td>
                      <input type="text" class="fmd-input" id="engineerFormAssociation" name="association" placeholder="협회명을 입력하세요.">
                    </td>
                    <th scope="row">기술등급</th>
                    <td>
                      <select class="fmd-select" id="engineerFormGrade" name="grade">
                        <option value="">선택</option>
                        <option value="초급">초급</option>
                        <option value="중급">중급</option>
                        <option value="고급">고급</option>
                        <option value="미가입">미가입</option>
                      </select>
                    </td>
                  </tr>
                  <tr>
                    <th scope="row">첨부파일</th>
                    <td colspan="3">
                      <div class="eng-file-upload" id="engineerFormFileWrap">
                        <div class="eng-file-view" id="engineerFormFileView" hidden>
                          <div class="eng-file-view__meta">
                            <strong id="engineerFormFileViewName"></strong>
                          </div>
                          <div class="eng-file-view__actions">
                            <button type="button" class="fmd-btn fmd-btn--edit" id="engineerFormDownloadBtn">다운로드</button>
                          </div>
                        </div>

                        <div class="eng-file-upload__row" id="engineerFormFileUpload">
                          <div class="eng-file-upload__body">
                            <div class="eng-file-picker">
                              <input type="file" id="engineerFormFile" name="file" accept=".pdf,.doc,.docx,.hwp" hidden>
                              <button type="button" class="eng-file-picker__btn" id="engineerFormFileBtn">파일 선택</button>
                              <span class="eng-file-picker__name" id="engineerFormFileName">선택된 파일 없음</span>
                            </div>
                            <div class="eng-file-drop" id="engineerFormFileDrop">파일을 드래그 해주세요.</div>
                          </div>
                          <div class="eng-file-upload__actions">
                            <button type="button" class="eng-file-delete" id="engineerFormFileDelete">파일삭제</button>
                            <span class="eng-file-hint">(용량 : 1GB 미만)</span>
                          </div>
                        </div>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </section>

          <div class="fmd-footer">
            <button type="button" class="fmd-btn fmd-btn--cancel" id="engineerCancelBtn">
              <span class="fmd-btn__icon">
                <img src="assets/main/facility-management/icon-cancel.svg" alt="" width="14" height="14">
              </span>
              취소
            </button>
            <button type="button" class="fmd-btn fmd-btn--edit" id="engineerEditBtn" hidden>
              <span class="fmd-btn__icon">
                <img src="assets/main/archive-board/icon-edit.svg" alt="" width="14" height="14">
              </span>
              수정하기
            </button>
            <button type="button" class="fmd-btn fmd-btn--cancel" id="engineerDeleteBtn" hidden>삭제</button>
            <button type="button" class="fmd-btn fmd-btn--save" id="engineerSaveBtn" hidden>
              <span class="fmd-btn__icon">
                <img src="assets/main/facility-management/icon-save.svg" alt="" width="14" height="14">
              </span>
              저장하기
            </button>
          </div>
        </form>
      </div>
    </div>
  </main>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar-admin.js"></script>
  <script src="js/responsible-engineer-data.js"></script>
  <script src="js/responsible-engineer-detail.js"></script>
</body>
</html>
