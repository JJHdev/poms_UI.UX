<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>시설물 관리 | POMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/admin-topnav.css">
  <link rel="stylesheet" href="css/pagination.css">
  <link rel="stylesheet" href="css/facility-change-request.css">
  <link rel="stylesheet" href="css/type3-port-facility.css">
  <link rel="stylesheet" href="css/facility-change-request-flat.css">
  <link rel="stylesheet" href="css/facility-management.css?v=20260820d">
  <link rel="stylesheet" href="css/facility-search.css">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1240px; }
  </style>
</head>
<body class="app-layout facility-search-page facility-change-request-page type3-port-page fcr-flat-page facility-management-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="fs-layout">
      <aside class="fs-lnb" aria-label="시스템 관리 메뉴">
        <div class="fs-lnb__title">
          <h2 class="fs-lnb__title-text">시스템 관리</h2>
        </div>
        <nav class="fs-lnb__nav" data-admin-sub-tabs="1" aria-label="시스템 관리 하위 메뉴">
          <a href="facility-management.html" class="fs-lnb__item is-active" aria-current="page">
            <span>시설물 관리</span>
            <span class="fs-lnb__chevron" aria-hidden="true">›</span>
          </a>
          <a href="maintenance-plan-manage.html" class="fs-lnb__item">
            <span>유지관리계획 관리</span>
            <span class="fs-lnb__chevron" aria-hidden="true">›</span>
          </a>
          <a href="mooring-facility-management.html" class="fs-lnb__item">
            <span>계류시설 관리</span>
            <span class="fs-lnb__chevron" aria-hidden="true">›</span>
          </a>
          <a href="facility-location-status.html" class="fs-lnb__item">
            <span>시설물 위치 현황 관리</span>
            <span class="fs-lnb__chevron" aria-hidden="true">›</span>
          </a>
          <a href="drone-video-management.html" class="fs-lnb__item">
            <span>드론 영상관리</span>
            <span class="fs-lnb__chevron" aria-hidden="true">›</span>
          </a>
          <a href="responsible-engineer.html" class="fs-lnb__item">
            <span>책임기술자 관리</span>
            <span class="fs-lnb__chevron" aria-hidden="true">›</span>
          </a>
        </nav>
      </aside>

      <div class="type3-page fs-manage" aria-label="시설물 관리">

      <div class="type3-section-title">
        <span class="type3-section-title__icon" aria-hidden="true">
          <img src="assets/main/facility-search/icon-condition.svg" alt="" width="24" height="24">
        </span>
        <h1 class="type3-section-title__text">검색조건</h1>
      </div>

      <section class="type3-filter-strip" aria-label="검색조건">
        <form class="type3-filter type3-filter--strip fm-filter" id="facilitySearchForm" novalidate>
          <div class="type3-filter__fields fm-filter-fields">
            <div class="type3-filter-row fm-filter-row">
              <div class="type3-field">
                <label for="filterAgency">관리기관</label>
                <select id="filterAgency" name="agency">
                  <option value="">전체</option>
                  <option value="부산항만공사">부산항만공사</option>
                  <option value="인천항만공사">인천항만공사</option>
                  <option value="여수광양항만공사">여수광양항만공사</option>
                  <option value="부산지방해양수산청">부산지방해양수산청</option>
                  <option value="여수지방해양수산청">여수지방해양수산청</option>
                  <option value="경상북도">경상북도</option>
                </select>
              </div>
              <div class="type3-field">
                <label for="filterPort">항</label>
                <select id="filterPort" name="port">
                  <option value="">전체</option>
                  <option value="부산항">부산항</option>
                  <option value="인천항">인천항</option>
                  <option value="광양항">광양항</option>
                  <option value="여수항">여수항</option>
                  <option value="거문도항">거문도항</option>
                  <option value="구룡포항">구룡포항</option>
                </select>
              </div>
              <div class="type3-field">
                <label for="filterSeaArea">세부항</label>
                <select id="filterSeaArea" name="seaArea">
                  <option value="">전체</option>
                </select>
              </div>
            </div>
            <div class="type3-filter-row fm-filter-row fm-filter-row--bottom">
              <div class="type3-field fm-field--types">
                <span class="type3-field__label" id="filterFacilityTypeLabel">시설구분</span>
                <div class="fac-stats-check-box" role="group" aria-labelledby="filterFacilityTypeLabel">
                  <label class="fac-stats-check" for="filterTypeMooring">
                    <input type="checkbox" id="filterTypeMooring" name="facilityType" value="계류시설">
                    <span class="fac-stats-check__box" aria-hidden="true"></span>
                    <span class="fac-stats-check__label">계류시설</span>
                  </label>
                  <label class="fac-stats-check" for="filterTypeOuter">
                    <input type="checkbox" id="filterTypeOuter" name="facilityType" value="외곽시설">
                    <span class="fac-stats-check__box" aria-hidden="true"></span>
                    <span class="fac-stats-check__label">외곽시설</span>
                  </label>
                  <label class="fac-stats-check" for="filterTypeBuilding">
                    <input type="checkbox" id="filterTypeBuilding" name="facilityType" value="건축물">
                    <span class="fac-stats-check__box" aria-hidden="true"></span>
                    <span class="fac-stats-check__label">건축물</span>
                  </label>
                  <label class="fac-stats-check" for="filterTypeTraffic">
                    <input type="checkbox" id="filterTypeTraffic" name="facilityType" value="교통시설">
                    <span class="fac-stats-check__box" aria-hidden="true"></span>
                    <span class="fac-stats-check__label">교통시설</span>
                  </label>
                  <label class="fac-stats-check" for="filterTypeOther">
                    <input type="checkbox" id="filterTypeOther" name="facilityType" value="기타">
                    <span class="fac-stats-check__box" aria-hidden="true"></span>
                    <span class="fac-stats-check__label">기타</span>
                  </label>
                </div>
              </div>
              <div class="type3-field type3-field--grow">
                <label for="filterFacilityName">시설물명</label>
                <input type="text" id="filterFacilityName" name="facilityName" placeholder="시설물명을 입력하세요.">
              </div>
              <div class="type3-filter-actions">
                <button type="submit" class="type3-btn type3-btn--search">
                  <img src="assets/main/facility-statistics/icon-search.svg" alt="" width="18" height="18">
                  검색하기
                </button>
                <button type="button" class="type3-btn type3-btn--reset" id="facilityResetBtn">
                  <img src="assets/main/facility-search/icon-reset.svg" alt="" width="18" height="18">
                  초기화
                </button>
              </div>
            </div>
          </div>
        </form>
      </section>

      <section class="type3-results-panel" aria-labelledby="facilityResultsTitle">
        <div class="type3-results__head">
          <div class="type3-results__count">
            <span class="type3-results__bar-icon" aria-hidden="true">
              <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="8" height="14">
            </span>
            <h2 id="facilityResultsTitle" class="type3-results__label">검색결과</h2>
            <p class="type3-results__meta">총 <strong id="facilityResultCount">0</strong>건</p>
          </div>
          <div class="fm-results-actions">
            <button type="button" class="type3-btn type3-btn--create" id="facilityExcelResultBtn">
              <img src="assets/main/facility-statistics/icon-excel.svg" alt="" width="18" height="18">
              검색 결과 엑셀 다운로드
            </button>
            <button type="button" class="type3-btn type3-btn--create" id="facilityExcelAllBtn">
              <img src="assets/main/facility-statistics/icon-excel.svg" alt="" width="18" height="18">
              전체 엑셀 다운로드
            </button>
            <button type="button" class="type3-btn type3-btn--create" id="facilityAddBtn">
              <img src="assets/main/archive-safety/icon-plus-dark.svg" alt="" width="18" height="18">
              시설물 추가
            </button>
          </div>
        </div>

        <div class="type3-table-wrap">
          <table class="type3-table" aria-label="시설물 관리 검색 결과">
            <thead>
              <tr>
                <th scope="col" class="col-no">번호</th>
                <th scope="col">항만구분</th>
                <th scope="col">관리구분</th>
                <th scope="col">관리기관</th>
                <th scope="col">해역</th>
                <th scope="col">항명</th>
                <th scope="col">세부항명</th>
                <th scope="col">시설구분</th>
                <th scope="col">시설물명</th>
              </tr>
            </thead>
            <tbody id="facilityTableBody"></tbody>
          </table>
        </div>

        <div class="type3-results-foot">
          <nav class="pagination" id="facilityPagination" aria-label="페이지 이동"></nav>
        </div>
      </section>
      </div>
    </div>
  </main>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar-admin.js"></script>
  <script src="js/pagination.js"></script>
  <script src="js/facility-management-data.js"></script>
  <script src="js/facility-management.js"></script>
</body>
</html>
