<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>보고서 제출이력 | POMS 관리자</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar.css">
  <link rel="stylesheet" href="css/admin-topnav.css">
  <link rel="stylesheet" href="css/inspection-status.css?v=20260810p">
  <link rel="stylesheet" href="css/pagination.css">
  <link rel="stylesheet" href="css/safety-report-approval.css">
  <link rel="stylesheet" href="css/report-submit-history.css?v=20260818a">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1280px; }
  </style>
</head>
<body class="app-layout inspection-status-page safety-report-approval-page report-submit-history-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="insp-status-page">
      <section class="insp-filter-panel" aria-labelledby="historyFilterTitle">
        <div class="insp-filter-panel__head">
          <div class="insp-filter-panel__head-main">
            <span class="insp-filter-panel__title-icon" aria-hidden="true">
              <img src="assets/main/facility-search/icon-condition.svg" alt="" width="24" height="24">
            </span>
            <h2 id="historyFilterTitle" class="insp-filter-panel__title">검색조건</h2>
          </div>
        </div>

        <form class="insp-filter" id="historySearchForm" role="search" novalidate>
          <div class="insp-filter__row rsh-filter-row">
            <div class="insp-field rsh-field--id">
              <label for="historyUserFilter">아이디</label>
              <input type="text" id="historyUserFilter" name="userId" placeholder="아이디를 입력해주세요." autocomplete="off">
            </div>

            <div class="insp-field rsh-field--service">
              <label for="historyServiceFilter">용역명</label>
              <input type="text" id="historyServiceFilter" name="serviceName" placeholder="용역명을 입력해주세요." autocomplete="off">
            </div>

            <div class="insp-field rsh-field--select">
              <label for="historyPortFilter">항명</label>
              <select id="historyPortFilter" name="port">
                <option value="">전체</option>
              </select>
            </div>

            <div class="insp-field rsh-field--select">
              <label for="historySubPortFilter">세부항명</label>
              <select id="historySubPortFilter" name="subPort">
                <option value="">전체</option>
              </select>
            </div>

            <div class="insp-field rsh-field--facility">
              <label for="historyFacilityFilter">시설물명</label>
              <input type="text" id="historyFacilityFilter" name="facilityName" placeholder="검색어를 입력해주세요." autocomplete="off">
            </div>

            <div class="insp-filter-actions">
              <button type="submit" class="insp-btn insp-btn--search" id="historySearch">
                <img src="assets/main/facility-statistics/icon-search.svg" alt="" width="18" height="18">
                검색하기
              </button>
              <button type="button" class="insp-btn insp-btn--reset" id="historyReset">
                <img src="assets/main/facility-search/icon-reset.svg" alt="" width="18" height="18">
                초기화
              </button>
            </div>
          </div>
        </form>
      </section>

      <div class="insp-divider" aria-hidden="true"></div>

      <section class="insp-results-panel" aria-labelledby="historyResultTitle">
        <div class="insp-results__head">
          <div class="insp-results__count">
            <span class="rsh-results__bar-icon" aria-hidden="true">
              <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="14" height="14">
            </span>
            <h2 id="historyResultTitle" class="insp-results__label">검색결과</h2>
            <p class="insp-results__meta" id="historyResultText">총 <strong>0</strong>건</p>
          </div>
        </div>

        <div class="insp-status-table-wrap">
          <table class="insp-status-table sra-table rsh-table" aria-label="보고서 제출이력 목록">
            <colgroup>
              <col class="col-no">
              <col class="col-id">
              <col class="col-service">
              <col class="col-date">
              <col class="col-count">
              <col class="col-stage">
              <col class="col-stage">
              <col class="col-progress">
            </colgroup>
            <thead>
              <tr>
                <th scope="col" class="col-no">번호</th>
                <th scope="col" class="col-id">ID</th>
                <th scope="col" class="col-service">용역명</th>
                <th scope="col" class="col-date">수정일</th>
                <th scope="col" class="col-count">신청개수</th>
                <th scope="col" class="col-stage">1단계</th>
                <th scope="col" class="col-stage">2단계</th>
                <th scope="col" class="col-progress">진행단계</th>
              </tr>
            </thead>
            <tbody id="historyTableBody"></tbody>
          </table>
        </div>

        <div class="insp-results-foot">
          <nav class="pagination" id="historyPagination" aria-label="페이지 이동"></nav>
          <label class="visually-hidden" for="historyPageSize">페이지당 표시 건수</label>
          <select id="historyPageSize" class="pagination-page-size" aria-label="페이지당 표시 건수" hidden>
            <option value="10" selected>10 / page</option>
          </select>
        </div>
      </section>
    </div>
  </main>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar-admin.js"></script>
  <script src="js/admin-mock.js"></script>
  <script src="js/pagination.js"></script>
  <script src="js/report-submit-history-data.js"></script>
  <script src="js/report-submit-history.js"></script>
</body>
</html>
