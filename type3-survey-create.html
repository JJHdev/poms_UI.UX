<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>실태조사 등록 | POMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/sidebar2.css">
  <link rel="stylesheet" href="css/facility-change-request.css">
  <link rel="stylesheet" href="css/type3-survey.css">
  <link rel="stylesheet" href="css/type3-port-facility.css">
  <link rel="stylesheet" href="css/type3-survey-detail.css">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; min-width: 1280px; }
  </style>
  <link rel="stylesheet" href="css/pagination.css?v=20260812p">
</head>
<body class="app-layout type3-port-page type3-survey-detail-page type3-survey-create-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="type3-page" aria-label="제 3종 항만시설물 실태조사 등록">
      <header class="page-header">
        <div class="page-header__nav">
          <a href="type3-port-facility.html" class="btn-back" id="type3CreateBackBtn" aria-label="목록으로">
            <span class="ico-angle" aria-hidden="true">
              <span class="ico-angle__vec">
                <img src="assets/main/facility-search/detail/figma224/icon-angle-down.svg" alt="">
              </span>
            </span>
          </a>
          <a href="type3-port-facility.html" class="page-header__home" aria-label="제 3종 항만시설물 목록">
            <span class="page-header__home-icon" aria-hidden="true">
              <span class="page-header__home-icon-roof"><img src="assets/main/facility-search/detail/figma224/icon-home-roof.svg" alt=""></span>
              <span class="page-header__home-icon-body"><img src="assets/main/facility-search/detail/figma224/icon-home-body.svg" alt=""></span>
              <span class="page-header__home-icon-door"><img src="assets/main/facility-search/detail/figma224/icon-home-door.svg" alt=""></span>
            </span>
          </a>
        </div>
        <nav class="breadcrumb" aria-label="현재 위치">
          <a href="inspection-status.html">시설물 관리</a>
          <span class="breadcrumb__sep" aria-hidden="true">&gt;</span>
          <a href="type3-port-facility.html">제 3종 항만시설물</a>
          <span class="breadcrumb__sep" aria-hidden="true">&gt;</span>
          <span class="breadcrumb__current">실태조사 등록</span>
        </nav>
      </header>

      <nav class="insp-status-tabs type3-detail-tabs" role="tablist" aria-label="제 3종 항만시설물 탭">
        <a href="type3-port-facility.html" class="insp-status-tabs__btn is-active" role="tab" aria-selected="true">3종시설물 실태조사</a>
        <a href="type3-port-facility.html?tab=survey-status" class="insp-status-tabs__btn" role="tab" aria-selected="false">3종시설물 실태조사 현황</a>
      </nav>

      <section class="type3-detail-summary" aria-label="실태조사 등록 개요">
        <div class="type3-section-title">
          <span class="type3-section-title__icon" aria-hidden="true">
            <img src="assets/main/facility-statistics/figma188/icon-title-clean.svg" alt="" width="24" height="24">
          </span>
          <h2 class="type3-section-title__text">시설물 정보</h2>
        </div>
        <div class="type3-detail-summary__body">
          <div class="type3-detail-info" aria-label="실태조사 등록 정보">
            <div class="type3-detail-info__row type3-detail-info__row--r1">
              <div class="type3-detail-info__pair type3-detail-info__pair--agency">
                <div class="type3-detail-info__label">실태조사기관</div>
                <div class="type3-detail-info__value">
                  <input type="text" class="type3-form-input" value="해양수산부" readonly>
                </div>
              </div>
              <div class="type3-detail-info__pair type3-detail-info__pair--manager">
                <div class="type3-detail-info__label">담당자</div>
                <div class="type3-detail-info__value type3-detail-info__value--end-top">
                  <input type="text" class="type3-form-input" id="type3CreateDept" placeholder="담당부서" aria-label="담당부서">
                  <input type="hidden" id="type3CreateManager" value="">
                </div>
              </div>
            </div>
            <div class="type3-detail-info__row type3-detail-info__row--r2">
              <div class="type3-detail-info__pair type3-detail-info__pair--manage-no">
                <div class="type3-detail-info__label type3-detail-info__label--start-bottom">관리번호</div>
                <div class="type3-detail-info__value">
                  <input type="text" class="type3-form-input" id="type3CreateManageNo" readonly>
                </div>
              </div>
              <div class="type3-detail-info__pair type3-detail-info__pair--period">
                <div class="type3-detail-info__label">실태조사입력기간</div>
                <div class="type3-detail-info__value">
                  <div class="type3-form-inline">
                    <input type="date" class="type3-form-input" id="type3CreatePeriodFrom">
                    <span class="type3-range-sep">~</span>
                    <input type="date" class="type3-form-input" id="type3CreatePeriodTo">
                  </div>
                </div>
              </div>
              <div class="type3-detail-info__pair type3-detail-info__pair--status">
                <div class="type3-detail-info__label">진행상태</div>
                <div class="type3-detail-info__value type3-detail-info__value--end-bottom">
                  <select class="type3-form-input" id="type3CreateStatus">
                    <option value="조사중" selected>조사중</option>
                    <option value="조사완료">조사완료</option>
                  </select>
                </div>
              </div>
            </div>
          </div>
          <div class="type3-detail-attach">
            <span class="type3-detail-attach__label">첨부파일</span>
            <button type="button" class="type3-info-file" id="type3CreateFileBtn" aria-label="첨부파일 선택">
              <img src="assets/main/type3-survey/figma192/icon-attach.svg" alt="" width="18" height="18">
              <span id="type3CreateFileName">파일을 선택하세요</span>
            </button>
            <input type="file" id="type3CreateFile" hidden>
          </div>
        </div>
      </section>

      <div class="type3-divider" aria-hidden="true"></div>

      <div class="type3-detail-body">
        <section class="type3-step-block" aria-label="실태조사 등록 단계">
          <nav class="type3-step-bars" role="tablist" aria-label="실태조사 등록 단계">
            <button type="button" class="type3-step-tab is-active" data-create-step="target" role="tab" aria-selected="true">
              <span class="type3-step-bar__badge">STEP. 01</span>
              <span class="type3-step-bar__label">대상시설물 선정</span>
            </button>
            <button type="button" class="type3-step-tab" data-create-step="assign" role="tab" aria-selected="false">
              <span class="type3-step-bar__badge">STEP. 02</span>
              <span class="type3-step-bar__label">담당자 지정</span>
            </button>
            <button type="button" class="type3-step-tab" data-create-step="conduct" role="tab" aria-selected="false">
              <span class="type3-step-bar__badge">STEP. 03</span>
              <span class="type3-step-bar__label">실태조사 실시</span>
            </button>
          </nav>
        </section>

        <section class="type3-results-panel" aria-labelledby="type3CreateStepTitle">
          <div class="type3-results__head">
            <div class="type3-results__count">
              <span class="type3-results__bar-icon" aria-hidden="true">
                <img src="assets/main/facility-statistics/figma188/icon-section-bar-clean.svg" alt="" width="14" height="14">
              </span>
              <h2 id="type3CreateStepTitle" class="type3-results__label">대상시설물 선정</h2>
              <p class="type3-results__meta">선택된 시설물 <strong id="type3CreateSelectedCount">0</strong>건</p>
            </div>
            <div class="type3-results__side">
              <p class="type3-list-guide-note" id="type3CreateGuide"></p>
            </div>
          </div>

          <div class="type3-create-bulk" id="type3CreateBulk" hidden>
            <span>담당자 일괄 지정</span>
            <input type="text" class="type3-form-input" id="type3BulkAssignee" placeholder="담당자명 입력">
            <button type="button" class="type3-btn type3-btn--search" id="type3BulkApplyBtn">일괄 적용</button>
          </div>

          <div class="type3-table-wrap">
            <table class="type3-table type3-step-table" aria-label="등록 단계별 시설물 목록">
              <colgroup id="type3CreateTableCols"></colgroup>
              <thead id="type3CreateTableHead"></thead>
              <tbody id="type3CreateTableBody"></tbody>
            </table>
          </div>

          <div class="type3-results-foot">
            <nav class="pagination" id="type3CreatePagination" aria-label="시설물 목록 페이지"></nav>
          </div>

          <div class="type3-create-actions">
            <button type="button" class="type3-btn type3-btn--ghost" id="type3CreateCancelBtn">취소</button>
            <button type="button" class="type3-btn type3-btn--search" id="type3CreateSaveBtn">저장</button>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="js/sidebar.js"></script>
  <script src="js/user-table-utils.js"></script>
  <script src="js/type3-survey-data.js"></script>
  <script src="js/type3-survey-create.js"></script>
</body>
</html>
