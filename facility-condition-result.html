<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조건검색 결과 | POMS</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
  <link rel="stylesheet" href="css/sidebar2.css">
  <link rel="stylesheet" href="css/user-table.css">
  <link rel="stylesheet" href="css/facility-search.css">
  <link rel="stylesheet" href="css/facility-condition-result.css">
  <style>
    body { font-family: "Pretendard", "Noto Sans KR", system-ui, sans-serif; margin: 0; }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
  <link rel="stylesheet" href="css/pagination.css?v=20260812p">
</head>
<body class="app-layout facility-search-page facility-condition-result-page">
  <div id="sidebar-root"></div>

  <main class="main-content">
    <div class="fs-layout">
      <aside class="fs-lnb" aria-label="시설물 정보 메뉴">
        <div class="fs-lnb__title">
          <span class="fs-lnb__title-text">시설물 정보</span>
        </div>
        <nav class="fs-lnb__nav">
          <a class="fs-lnb__item" href="facility-search.html">
            <span>시설물 통합검색</span>
            <img class="fs-lnb__chevron" src="assets/main/facility-search/figma224/icon-lnb-chevron.svg" alt="" width="16" height="16">
          </a>
          <a class="fs-lnb__item is-active" href="facility-condition-search.html" aria-current="page">
            <span>시설물 조건검색</span>
            <img class="fs-lnb__chevron" src="assets/main/facility-search/figma224/icon-lnb-chevron.svg" alt="" width="16" height="16">
          </a>
        </nav>
      </aside>

      <div class="fs-condition">
    <header class="page-header">
      <div class="page-header__nav">
        <a href="facility-condition-search.html" class="btn-back" aria-label="조건검색으로">
          <span class="ico-angle" aria-hidden="true">
            <span class="ico-angle__vec">
              <img src="assets/main/facility-search/detail/figma224/icon-angle-down.svg" alt="">
            </span>
          </span>
        </a>
        <a href="facility.html" class="page-header__home" aria-label="시설물 정보 홈">
          <span class="page-header__home-icon" aria-hidden="true">
            <span class="page-header__home-icon-roof"><img src="assets/main/facility-search/detail/figma224/icon-home-roof.svg" alt=""></span>
            <span class="page-header__home-icon-body"><img src="assets/main/facility-search/detail/figma224/icon-home-body.svg" alt=""></span>
            <span class="page-header__home-icon-door"><img src="assets/main/facility-search/detail/figma224/icon-home-door.svg" alt=""></span>
          </span>
        </a>
      </div>
      <nav class="breadcrumb" aria-label="현재 위치">
        <a href="facility.html">시설물 정보</a>
        <span class="breadcrumb__sep" aria-hidden="true">&gt;</span>
        <a href="facility-condition-search.html">시설물 조건검색</a>
        <span class="breadcrumb__sep" aria-hidden="true">&gt;</span>
        <span class="breadcrumb__current">검색결과</span>
      </nav>
    </header>

    <section class="results-panel" aria-labelledby="conditionResultsTitle">
      <div class="results-panel__head">
        <div class="results-panel__head-main">
          <span class="results-panel__bar" aria-hidden="true">
            <img src="assets/main/facility-search/detail/figma224/icon-section-bar.svg" alt="" width="8" height="14">
          </span>
          <p class="results-count" id="conditionResultsTitle">
            <span class="results-count__label">검색결과</span>
            <span class="results-count__meta">총 <strong id="conditionResultCount">0</strong>건</span>
          </p>
        </div>
        <button type="button" class="btn-excel" id="conditionDownloadBtn">
          <img src="assets/main/facility-statistics/icon-excel.svg" alt="" width="18" height="18">
          엑셀 다운로드
        </button>
      </div>

      <form class="search-filters condition-results-filter" aria-label="결과 목록 분류 검색" id="conditionResultsFilterForm">
        <div class="search-filters__row">
          <div class="filter-field filter-field--grow">
            <label for="resultMajorCategory">대분류</label>
            <select id="resultMajorCategory" name="majorCategory">
              <option value="facility-status" selected>시설물 현황</option>
              <option value="inspection-status">점검 현황</option>
              <option value="repair-status">보수 현황</option>
            </select>
          </div>
          <div class="filter-field filter-field--grow">
            <label for="resultMiddleCategory">중분류</label>
            <select id="resultMiddleCategory" name="middleCategory">
              <option value="overview" selected>총괄</option>
              <option value="by-port">항별</option>
              <option value="by-type">시설구분별</option>
            </select>
          </div>
          <div class="filter-field filter-field--grow">
            <label for="resultMinorCategory">소분류</label>
            <select id="resultMinorCategory" name="minorCategory">
              <option value="" selected>전체</option>
              <option value="mooring">계류시설</option>
              <option value="quay">안벽시설</option>
              <option value="outer">외곽시설</option>
              <option value="bridge">교량시설</option>
            </select>
          </div>
          <div class="search-actions">
            <button type="button" class="btn-search" id="conditionResultsSearchBtn">
              <img src="assets/main/facility-search/icon-search.svg" alt="" width="18" height="18">
              검색
            </button>
          </div>
        </div>
      </form>

      <div class="data-table-wrap">
        <table class="data-table condition-table">
          <thead>
            <tr id="conditionTableHead"></tr>
            <tr id="conditionTableFilterRow"></tr>
          </thead>
          <tbody id="conditionTableBody"></tbody>
        </table>
      </div>

      <div class="results-panel__foot">
        <nav class="pagination" id="conditionPagination" aria-label="검색결과 페이지"></nav>
      </div>
    </section>
      </div><!-- /.fs-condition -->
    </div><!-- /.fs-layout -->
  </main>

  <script src="js/auth-sample.js"></script>
  <script src="js/sidebar.js"></script>
  <script src="js/user-table-utils.js"></script>
  <script src="js/facility-condition-search-data.js"></script>
  <script src="js/facility-condition-result.js"></script>
  <script>
    PomsSidebar.mount('#sidebar-root', { active: 'facility-filter' });
  </script>
</body>
</html>
